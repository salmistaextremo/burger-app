<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F8FA">
<!-- PWA: Hace que la app se pueda instalar en el celular del repartidor -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Panel Repartidor</title>

<link rel="manifest" href="/manifest-repartidor.json">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
:root{
  --bg:#F7F8FA; --surface:#FFFFFF; --line:#E5E7EB; --ink:#111827; --muted:#9CA3AF;
  --brand:#FF5A1F; --brand-soft:#FFF0EA; --ok:#10B981; --danger:#EF4444;
  --shadow:0 4px 16px rgba(17,24,39,0.06);
  --font:'Outfit', sans-serif;
}
body{font-family:var(--font);background:var(--bg);color:var(--ink);min-height:100vh}
#app{max-width:520px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:90px;}

/* LOGIN */
.login-screen{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;align-items:center;justify-content:center;padding:24px;}
.login-box{background:var(--surface);width:100%;max-width:380px;border-radius:24px;padding:32px 24px;text-align:center;box-shadow:var(--shadow);}
.login-icon{width:70px;height:70px;border-radius:20px;background:linear-gradient(135deg, #FF7A45, var(--brand));display:grid;place-items:center;font-size:32px;margin:0 auto 16px;color:white;}
.login-box h2{margin:0 0 8px;font-size:22px;font-weight:900;}
.login-box p{margin:0 0 24px;font-size:14px;color:var(--muted);}
.field{text-align:left;margin-bottom:16px;}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px;}
.field input{width:100%;padding:14px;border-radius:12px;border:2px solid var(--line);font-size:15px;font-family:inherit;outline:none;}
.field input:focus{border-color:var(--brand);}
.btn-login{width:100%;padding:16px;border-radius:14px;border:none;background:var(--brand);color:#fff;font-size:16px;font-weight:800;cursor:pointer;}

/* HEADER */
.header{background:var(--surface);padding:16px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;border-bottom:1px solid var(--line);}
.header-info h1{font-size:18px;font-weight:900;margin:0;}
.header-info p{font-size:12px;color:var(--muted);margin:2px 0 0;}
.btn-logout{background:transparent;border:none;color:var(--danger);font-weight:700;font-size:13px;cursor:pointer;}
.btn-install-driver{display:none; background:var(--brand); color:#fff; border:none; padding:8px 12px; border-radius:8px; font-weight:700; font-size:12px; cursor:pointer;}

/* PEDIDOS */
.content{padding:20px;}
.order-card{background:var(--surface);border-radius:20px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow);}
.order-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;border-bottom:1px dashed var(--line);padding-bottom:12px;}
.order-code{font-size:20px;font-weight:900;color:var(--brand);}
.order-status{font-size:11px;font-weight:800;padding:4px 8px;border-radius:6px;background:#FEF3C7;color:#D97706;}
.order-info{font-size:14px;line-height:1.6;margin-bottom:12px;}
.order-info b{font-weight:700;}
.order-items{background:var(--bg);padding:12px;border-radius:12px;font-size:13px;margin-bottom:16px;line-height:1.5;}
.btn-actions{display:flex;gap:10px;}
.btn-map{flex:1;padding:12px;border-radius:12px;border:2px solid var(--brand);background:transparent;color:var(--brand);font-weight:800;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;}
.btn-delivered{flex:1;padding:12px;border-radius:12px;border:none;background:var(--ok);color:white;font-weight:800;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 24px;border-radius:12px;font-size:14px;opacity:0;transition:.3s;z-index:200;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* =========================================
   ESTADOS DE CARGA, VACÍO Y ERROR
   ========================================= */
.state-container {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 40px 20px; text-align: center; animation: fadeIn 0.3s ease; width: 100%;
}
.state-icon { font-size: 56px; margin-bottom: 16px; opacity: 0.8; }
.state-title { font-size: 18px; font-weight: 800; color: var(--ink); margin-bottom: 8px; }
.state-desc { font-size: 14px; color: var(--muted); margin-bottom: 24px; max-width: 300px; line-height: 1.5; }
.btn-retry { background: var(--surface-2); color: var(--brand); border: 1px solid var(--line); padding: 12px 24px; border-radius: 12px; font-weight: 700; cursor: pointer; transition: 0.2s; }
.btn-retry:hover { background: var(--brand-soft); border-color: var(--brand); }

/* Esqueletos de Carga (Skeletons) */
.skeleton { background: var(--line); border-radius: 8px; animation: pulse-bg 1.5s infinite ease-in-out; }
@keyframes pulse-bg { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
.skeleton-card { height: 160px; border-radius: 20px; margin-bottom: 16px; }
</style>
</head>
<body>

<!-- PANTALLA DE LOGIN -->
<div id="loginScreen" class="login-screen">
  <div class="login-box">
    <div class="login-icon">🛵</div>
    <h2>Panel Repartidor</h2>
    <p>Ingresa tus credenciales para ver tus entregas.</p>
    <div class="field"><label>Correo / Usuario</label><input type="email" id="dEmail" placeholder="correo@ejemplo.com"></div>
    <div class="field"><label>Contraseña</label><input type="password" id="dPass" placeholder="••••••••"></div>
    <button class="btn-login" onclick="loginDriver()">Iniciar Sesión</button>
  </div>
</div>

<!-- PANEL PRINCIPAL -->
<div id="app" class="hidden">
  <header class="header">
    <div class="header-info">
      <h1 id="dName">Repartidor</h1>
      <p>Pedidos en camino</p>
    </div>
    <div style="display:flex; align-items:center; gap:10px;">
      <button id="btnInstallDriver" class="btn-install-driver" onclick="installDriverApp()">Instalar App</button>
      <button class="btn-logout" onclick="logoutDriver()">Salir</button>
    </div>
  </header>
  
  <div class="content" id="ordersList">
    <!-- Aquí se cargan los pedidos -->
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://ydueyhlvkmxrsprfgyal.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlkdWV5aGx2a214cnNwcmZneWFsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMwMzMxMDEsImV4cCI6MjEwODYwOTEwMX0.Ha_3BJngwg4motQb0NgeoslDCJsfR-nbkxWnfbFj6rM';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let currentDriver = null;
  let refreshInterval = null;
  
  // Variables para el control de sonido y pedidos nuevos
  let knownOrderIds = new Set();
  let audioCtx;
  window.hasLoadedOnce = false; 

  function toast(msg) { 
    var t = document.getElementById("toast"); 
    t.textContent = msg; t.classList.add("show"); 
    setTimeout(() => t.classList.remove("show"), 3000); 
  }

  // =========================================
// GENERADOR DE PALETA DE COLORES DINÁMICA
// =========================================
function applyBrandColors(baseColor) {
  // Si no hay color, usamos el naranja por defecto
  if (!baseColor || !baseColor.startsWith('#')) baseColor = '#FF5A1F';

  // Aplicar el color principal
  document.documentElement.style.setProperty('--brand', baseColor);
  
  // Generar versión con 10% de opacidad para fondos suaves (ej: #FF5A1F1A)
  document.documentElement.style.setProperty('--brand-soft', baseColor + '1A');

  // Calcular versión oscura (para textos sobre fondo claro o hovers)
  let r = parseInt(baseColor.slice(1, 3), 16);
  let g = parseInt(baseColor.slice(3, 5), 16);
  let b = parseInt(baseColor.slice(5, 7), 16);
  
  // Oscurecer un 20%
  let rDark = Math.max(0, Math.floor(r * 0.8));
  let gDark = Math.max(0, Math.floor(g * 0.8));
  let bDark = Math.max(0, Math.floor(b * 0.8));
  
  const darkHex = `#${rDark.toString(16).padStart(2, '0')}${gDark.toString(16).padStart(2, '0')}${bDark.toString(16).padStart(2, '0')}`;
  document.documentElement.style.setProperty('--brand-d', darkHex);

  // Calcular versión clara (para degradados)
  let rLight = Math.min(255, Math.floor(r + (255 - r) * 0.2));
  let gLight = Math.min(255, Math.floor(g + (255 - g) * 0.2));
  let bLight = Math.min(255, Math.floor(b + (255 - b) * 0.2));
  
  const lightHex = `#${rLight.toString(16).padStart(2, '0')}${gLight.toString(16).padStart(2, '0')}${bLight.toString(16).padStart(2, '0')}`;
  document.documentElement.style.setProperty('--brand-2', lightHex);
}

  // GENERADORES DE ESTADOS (UI HELPERS)
  function getLoadingHTML(count = 2) {
    let html = '';
    for(let i=0; i<count; i++) {
      html += `<div class="skeleton skeleton-card"></div>`;
    }
    return html;
  }

  function getEmptyHTML(title, desc, icon = '🛵') {
    return `
      <div class="state-container">
        <div class="state-icon">${icon}</div>
        <div class="state-title">${title}</div>
        <div class="state-desc">${desc}</div>
      </div>`;
  }

  function getErrorHTML(message, retryFunctionName) {
    return `
      <div class="state-container">
        <div class="state-icon" style="color:var(--danger);">⚠️</div>
        <div class="state-title">Algo salió mal</div>
        <div class="state-desc">${message}</div>
        <button class="btn-retry" onclick="${retryFunctionName}()">🔄 Reintentar</button>
      </div>`;
  }

  // CARGAR COLORES Y NOMBRE
  async function cargarColoresMarca() {
    try {
      const { data } = await supabaseClient.from('config').select('brand, primary_color').eq('id', 1).single();
      if (data) {
        if (data.brand) document.title = `${data.brand} — Repartidor`;
        if (data.primary_color) {
          document.documentElement.style.setProperty('--brand', data.primary_color);
          document.documentElement.style.setProperty('--brand-soft', data.primary_color + '1A'); 
        }
      }
    } catch(e) { console.log("Error cargando colores de marca"); }
  }

  // SONIDO DE CAMPANA
  function playNotificationSound() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(600, audioCtx.currentTime);
      osc.frequency.setValueAtTime(800, audioCtx.currentTime + 0.2);
      
      gain.gain.setValueAtTime(0.6, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
      
      osc.connect(gain); 
      gain.connect(audioCtx.destination);
      osc.start(); 
      osc.stop(audioCtx.currentTime + 0.5);
    } catch(e) { console.log("Audio error:", e); }
  }

  // LOGIN
  async function loginDriver() {
    const email = document.getElementById("dEmail").value.trim();
    const pass = document.getElementById("dPass").value.trim();
    if (!email || !pass) return toast("Llena todos los campos");

    const btn = document.querySelector('.btn-login');
    btn.disabled = true; btn.textContent = "Verificando...";

    const { data, error } = await supabaseClient.rpc('verify_driver', { 
      driver_email: email, 
      driver_password: pass 
    });

    btn.disabled = false; btn.textContent = "Iniciar Sesión";

    if (error) {
      console.error("Error RPC:", error);
      return toast("❌ Error de conexión. Intenta de nuevo.");
    }

    if (!data || data.length === 0) {
      return toast("❌ Correo o contraseña incorrectos");
    }

    const driver = data[0];
    driver.password = pass;

    if (!driver.active) {
      return toast("🚫 Tu cuenta está inhabilitada. Contacta al administrador.");
    }

    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    audioCtx.resume();

    currentDriver = driver;
    localStorage.setItem('driver_session', JSON.stringify(currentDriver));
    
    knownOrderIds.clear();
    window.hasLoadedOnce = false;

    startPanel();
  }

  function logoutDriver() {
    localStorage.removeItem('driver_session');
    currentDriver = null;
    knownOrderIds.clear();
    window.hasLoadedOnce = false;
    document.getElementById("loginScreen").style.display = "flex";
    document.getElementById("app").classList.add("hidden");
    if (refreshInterval) clearInterval(refreshInterval);
  }

  function startPanel() {
    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("app").classList.remove("hidden");
    document.getElementById("dName").textContent = currentDriver.name;
    loadOrders();
    
    if (refreshInterval) clearInterval(refreshInterval);
    refreshInterval = setInterval(() => {
      if (document.visibilityState === 'visible') { loadOrders(); }
    }, 10000);
  }

  // CARGA DE PEDIDOS CON ESTADOS VISUALES
  async function loadOrders() {
    const list = document.getElementById("ordersList");
    
    // Si es la primera carga, mostramos los esqueletos
    if (!window.hasLoadedOnce) {
      list.innerHTML = getLoadingHTML(2);
    }

    try {
      const { data: orders, error } = await supabaseClient.rpc('get_driver_orders', {
        driver_email: currentDriver.email, 
        driver_password: currentDriver.password 
      });

      if (error) throw error;

      // ESTADO VACÍO
      if (!orders || orders.length === 0) {
        list.innerHTML = getEmptyHTML("Todo al día", "No tienes entregas pendientes por ahora.", "🛵");
        knownOrderIds.clear();
        window.hasLoadedOnce = true;
        return;
      }

      // LÓGICA PARA DETECTAR PEDIDOS NUEVOS (Sonido)
      let hasNewOrder = false;
      orders.forEach(o => {
        if (!knownOrderIds.has(o.id)) {
          hasNewOrder = true;
          knownOrderIds.add(o.id);
        }
      });

      if (hasNewOrder && window.hasLoadedOnce) {
         playNotificationSound();
         toast("🔔 ¡Nuevo pedido asignado!");
      }
      
      window.hasLoadedOnce = true; 

      // RENDERIZADO DE PEDIDOS
      list.innerHTML = orders.map(o => {
        const c = o.customer;
        const isDelivery = o.type === 'delivery';
        
        let mapBtn = '';
        if (isDelivery && c.locationUrl) {
          mapBtn = `<a href="${c.locationUrl}" target="_blank" class="btn-map">📍 Ver Mapa</a>`;
        }

        return `
          <div class="order-card">
            <div class="order-head">
              <span class="order-code">${o.code}</span>
              <span class="order-status">${isDelivery ? 'En Camino' : 'Para Retirar'}</span>
            </div>
            
            <div class="order-info">
              <b>Cliente:</b> ${c.name}<br>
              <b>Tel:</b> <a href="tel:${c.phone}" style="color:var(--brand)">${c.phone}</a><br>
              ${isDelivery ? `<b>Dirección:</b> ${c.address || 'Sin dirección'}<br><b>Ref:</b> ${c.ref || 'N/A'}` : `<b>Tipo:</b> Retiro en Tienda`}
            </div>

            <div class="order-items">
              ${o.items.map(i => `<div>${i.qty}x ${i.name}</div>`).join('')}
            </div>

            <div class="btn-actions">
              ${mapBtn}
              <button class="btn-delivered" onclick="markDelivered('${o.id}')">✅ Entregado</button>
            </div>
          </div>
        `;
      }).join('');

    } catch (err) {
      console.error("Error al cargar pedidos:", err);
      // ESTADO DE ERROR
      list.innerHTML = getErrorHTML("Error de conexión. No pudimos cargar tus entregas.", "loadOrders");
    }
  }

  // MARCAR ENTREGADO
  async function markDelivered(orderId) {
    if (!confirm("¿Confirmar que este pedido fue entregado?")) return;
    
    const { data: success, error } = await supabaseClient.rpc('mark_order_delivered', {
      driver_email: currentDriver.email, 
      driver_password: currentDriver.password, 
      order_uuid: orderId
    });
    
    if (error || !success) {
      toast("Error al actualizar el pedido");
    } else {
      toast("✅ Pedido marcado como entregado");
      knownOrderIds.delete(orderId);
      window.hasLoadedOnce = false; // Forzamos esqueleto visual al recargar
      loadOrders();
    }
  }

  // LÓGICA PWA (APP REPARTIDOR)
  let deferredPromptDriver;
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPromptDriver = e;
    if (window.matchMedia('(display-mode: standalone)').matches) return;
    document.getElementById('btnInstallDriver').style.display = 'block';
  });

  function installDriverApp() {
    if (deferredPromptDriver) {
      deferredPromptDriver.prompt();
      deferredPromptDriver.userChoice.then((choiceResult) => {
        if (choiceResult.outcome === 'accepted') {
          toast("✅ ¡App de repartidor instalada!");
          document.getElementById('btnInstallDriver').style.display = 'none';
        }
        deferredPromptDriver = null;
      });
    } else {
      alert("Para instalar la app:\n\n1. Abre el menú del navegador.\n2. Selecciona 'Añadir a pantalla de inicio'.");
    }
  }

  // INICIALIZACIÓN
  window.addEventListener('DOMContentLoaded', () => {
    cargarColoresMarca();
    
    const saved = localStorage.getItem('driver_session');
    if (saved) {
      try {
        currentDriver = JSON.parse(saved);
        startPanel();
      } catch(e) { localStorage.removeItem('driver_session'); }
    }
  });

  // Detector para actualizar al volver a la app
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && currentDriver) {
      loadOrders();
    }
  });
</script>
</body>
</html>
