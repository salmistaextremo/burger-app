<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel Admin — Burguer Express</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#F5F6F8; --surface:#FFFFFF; --surface-2:#F0F1F4;
  --line:#E5E7EB; --line-2:#D1D5DB;
  --ink:#111827; --ink-2:#374151; --muted:#6B7280; --muted-2:#9CA3AF;
  --brand:#FF6B2C; --brand-2:#FF8A4C; --brand-d:#E85A1F; --brand-soft:#FFF2EC;
  --ok:#10B981; --ok-soft:#ECFDF5;
  --danger:#EF4444; --danger-soft:#FEF2F2;
  --r:12px; --r-lg:16px;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --shadow-lg:0 20px 50px rgba(0,0,0,.15);
}
*{margin:0;padding:0}
html,body{background:var(--bg);font-family:'Inter',sans-serif;color:var(--ink);min-height:100vh}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:14px;width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);outline:none;transition:.15s}
input:focus,textarea:focus,select:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(255,107,44,.12)}
textarea{resize:vertical;min-height:80px}
.hidden{display:none !important}

.auth-screen{position:fixed;inset:0;z-index:999;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
.auth-box{background:var(--surface);width:100%;max-width:400px;border-radius:20px;padding:32px 24px;box-shadow:var(--shadow-lg);text-align:center}
.auth-logo{width:60px;height:60px;border-radius:16px;background:linear-gradient(135deg,var(--brand-2),var(--brand));display:grid;place-items:center;font-size:30px;margin:0 auto 16px;color:#fff}
.auth-box h2{margin:0 0 8px;font-size:22px;font-weight:800}
.auth-box p{margin:0 0 24px;font-size:13.5px;color:var(--muted)}
.auth-box .field{margin-bottom:16px;text-align:left}
.auth-box .btn{width:100%}
.auth-error{background:var(--danger-soft);color:var(--danger);padding:10px;border-radius:8px;font-size:12.5px;font-weight:600;margin-bottom:16px;display:none}

.app{display:flex;min-height:100vh}
.sidebar{width:240px;background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;flex:none;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.sb-brand{display:flex;align-items:center;gap:10px;padding:8px 10px 20px;border-bottom:1px solid var(--line);margin-bottom:12px}
.sb-logo{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:18px;background:linear-gradient(135deg,var(--brand-2),var(--brand));color:#fff}
.sb-brand-text h1{font-size:14px;font-weight:800}
.sb-brand-text p{font-size:11px;color:var(--muted)}
.sb-nav{display:flex;flex-direction:column;gap:3px;flex:1}
.sb-nav button{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:10px;font-size:13.5px;font-weight:500;color:var(--ink-2);text-align:left;transition:.15s}
.sb-nav button .ico{font-size:17px;width:20px;text-align:center}
.sb-nav button:hover{background:var(--surface-2);color:var(--ink)}
.sb-nav button.active{background:var(--brand-soft);color:var(--brand-d);font-weight:600}
.sb-nav button .count{margin-left:auto;font-size:11px;font-weight:700;background:var(--surface-2);color:var(--muted);padding:2px 7px;border-radius:99px}
.sb-nav button.active .count{background:var(--brand);color:#fff}
.sb-footer{padding-top:12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.sb-footer a,.sb-footer button{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;font-size:13px;font-weight:500;color:var(--ink-2);text-decoration:none;}
.sb-footer .logout-btn{color:var(--danger)}

.main{flex:1;padding:32px 40px;max-width:1200px}
.page-title{margin-bottom:4px;font-size:26px;font-weight:900}
.page-sub{color:var(--muted);font-size:13.5px;margin-bottom:24px}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:11px;font-size:13.5px;font-weight:600;transition:.15s;}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,var(--brand-2),var(--brand));color:#fff;}
.btn-ghost{background:var(--surface);border:1px solid var(--line);color:var(--ink-2);}
.btn-ghost:hover{background:var(--surface-2);}
.btn-sm{padding:7px 12px;font-size:12.5px;}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.card-body{padding:20px}
.card-title{font-size:15px;font-weight:700;margin-bottom:4px}
.card-desc{font-size:12.5px;color:var(--muted);margin-bottom:16px}

.welcome-card{background:linear-gradient(135deg, var(--brand-2), var(--brand));color:#fff;border-radius:20px;padding:32px;margin-bottom:24px;}
.welcome-card h1{margin:0 0 8px;font-size:28px;font-weight:900}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:32px}
.stat-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;align-items:center;gap:16px;}
.stat-icon{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;font-size:24px;flex:none}
.stat-info p{margin:0;font-size:12.5px;font-weight:600;color:var(--muted);text-transform:uppercase;}
.stat-info h3{margin:4px 0 0;font-size:24px;font-weight:900}

/* REPORTES */
.report-filters{display:flex;gap:16px;align-items:flex-end;margin-bottom:24px;flex-wrap:wrap}
.report-filters .field{margin:0;flex:1;min-width:150px}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;font-weight:600;margin-bottom:6px;color:var(--ink-2)}

/* ESTILO VERTICAL PARA LOS BOTONES DE REPORTE */
.report-actions { 
  display: flex; 
  flex-direction: column; 
  gap: 10px; 
  margin-bottom: 24px; 
}
.report-actions .btn {
  width: 100%;
  max-width: 350px; /* Opcional: para que no se estiren demasiado en PC */
}

.report-table{width:100%;border-collapse:collapse;margin-top:16px;font-size:13.5px}
.report-table th{text-align:left;padding:12px;border-bottom:2px solid var(--line);color:var(--muted);font-weight:700}
.report-table td{padding:12px;border-bottom:1px solid var(--line);color:var(--ink-2)}
.report-table tr:hover td{background:var(--surface-2)}

.p-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.p-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;gap:12px;padding:12px;}
.p-thumb{width:70px;height:70px;border-radius:10px;background:var(--surface-2);flex:none;display:grid;place-items:center;font-size:30px;}
.p-info{flex:1;min-width:0}
.p-actions{margin-left:auto;display:flex;gap:4px;}
.p-actions button{width:30px;height:30px;border-radius:8px;background:var(--surface-2);color:var(--muted);}

.modal{position:fixed;inset:0;z-index:100;background:rgba(17,24,39,.5);display:flex;align-items:center;justify-content:center;padding:20px}
.modal-box{background:var(--surface);border-radius:20px;width:100%;max-width:640px;max-height:92vh;display:flex;flex-direction:column;}
.modal-head{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;}
.modal-body{padding:24px;overflow-y:auto;}
.modal-foot{padding:16px 24px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;}

.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);z-index:200;background:var(--ink);color:#fff;padding:13px 22px;border-radius:11px;font-size:13.5px;opacity:0;transition:.3s;}
.toast.show{opacity:1;}
.empty{text-align:center;padding:60px 20px;color:var(--muted);}

@media print {
  body * { visibility: hidden; }
  .main, .main * { visibility: visible; }
  .main { position: absolute; left: 0; top: 0; width: 100%; padding: 0; }
  .sidebar, .report-filters, .report-actions { display: none !important; }
  .card, .stat-card { box-shadow: none !important; border: 1px solid #ccc !important; }
  .stats-grid { display: flex !important; flex-wrap: wrap; gap: 10px; }
  .stat-card { flex: 1; min-width: 150px; }
}
@media(max-width:860px){
  .app{flex-direction:column}
  .sidebar{width:100%;height:auto;position:static;flex-direction:row;padding:12px;overflow-x:auto;}
  .main{padding:20px 16px}
}
</style>
</head>
<body>

<div id="authScreen" class="auth-screen">
  <div id="loginBox" class="auth-box">
    <div class="auth-logo">🍔</div>
    <h2>Admin Panel</h2>
    <p>Inicia sesión con tu cuenta de administrador.</p>
    <div class="auth-error" id="loginError">Correo o contraseña incorrectos.</div>
    <div class="field"><label>Correo Electrónico</label><input type="email" id="loginUser" placeholder="admin@tuburguer.com"></div>
    <div class="field"><label>Contraseña</label><input type="password" id="loginPass" placeholder="••••••••"></div>
    <button class="btn btn-primary" onclick="doLogin()">Entrar al panel</button>
  </div>
</div>

<div class="app hidden" id="appContainer">
  <aside class="sidebar">
    <div class="sb-brand">
      <div class="sb-logo" id="sbLogo">⚙️</div>
      <div class="sb-brand-text"><h1>Admin Panel</h1><p id="sbBrandName">Burguer Express</p></div>
    </div>
    <nav class="sb-nav">
      <button data-tab="home" class="active"><span class="ico">🏠</span>Inicio</button>
      <button data-tab="products"><span class="ico">🍔</span>Productos<span class="count" id="cnt-products">0</span></button>
      <button data-tab="categories"><span class="ico">📁</span>Categorías<span class="count" id="cnt-categories">0</span></button>
      <button data-tab="orders"><span class="ico">🧾</span>Pedidos<span class="count" id="cnt-orders">0</span></button>
      <button data-tab="reports"><span class="ico">📈</span>Reportes</button>
      <button data-tab="business"><span class="ico">🏪</span>Negocio</button>
    </nav>
    <div class="sb-footer">
      <a href="index.html" target="_blank"><span>👁️</span>Ver app cliente</a>
      <button class="logout-btn" onclick="doLogout()"><span>🚪</span>Cerrar sesión</button>
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>

<div id="modal" class="modal hidden"></div>
<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://nhwqaahesbksimtizomt.supabase.co'; 
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5od3FhYWhlc2Jrc2ltdGl6b210Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIyNjM1OTYsImV4cCI6MjEwNzgzOTU5Nn0.Hx6HH3Nh9YrwoYJgWhUGx-kXolfIpQpLoL89fQiWaC8';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
</script>

<script>
var DB = { config: {}, cats: [], menu: [], orders: [] };
var state = { tab: "home" };

async function checkAuth() {
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (session) {
    document.getElementById("authScreen").classList.add("hidden");
    document.getElementById("appContainer").classList.remove("hidden");
    await dbLoad(); render(); setupNav();
  } else {
    document.getElementById("authScreen").classList.remove("hidden");
    document.getElementById("appContainer").classList.add("hidden");
  }
}

function doLogin() {
  const email = document.getElementById("loginUser").value.trim();
  const password = document.getElementById("loginPass").value;
  const err = document.getElementById("loginError");
  supabaseClient.auth.signInWithPassword({ email, password }).then(({ error }) => {
    if (error) { err.style.display = "block"; } else { toast("✅ Bienvenido"); }
  });
}

function doLogout() {
  if (!confirm("¿Cerrar sesión?")) return;
  supabaseClient.auth.signOut().then(() => location.reload());
}

async function dbLoad() {
  const { data: config } = await supabaseClient.from('config').select('*').eq('id', 1).single();
  DB.config = config || {};
  const { data: cats } = await supabaseClient.from('categories').select('*');
  DB.cats = cats || [];
  const { data: products } = await supabaseClient.from('products').select('*');
  DB.menu = products ? products.map(p => ({ ...p, cat: p.category_id, desc: p.description })) : [];
  const { data: orders } = await supabaseClient.from('orders').select('*').order('created_at', { ascending: false });
  DB.orders = orders || [];
}

function $(s, r){ r = r || document; return r.querySelector(s); }
function $$(s, r){ r = r || document; return Array.prototype.slice.call(r.querySelectorAll(s)); }
function toast(m){ var t = $("#toast"); t.textContent = m; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 2500); }
function setupNav() {
  $$(".sb-nav button").forEach(b => b.onclick = () => { state.tab = b.dataset.tab; $$(".sb-nav button").forEach(x => x.classList.toggle("active", x.dataset.tab === state.tab)); render(); window.scrollTo(0,0); });
}

function render() {
  var m = $("#main");
  if (state.tab === "home") renderHome(m);
  else if (state.tab === "products") renderProducts(m);
  else if (state.tab === "orders") renderOrders(m);
  else if (state.tab === "reports") renderReports(m);
  else if (state.tab === "business") renderBusiness(m);
  else if (state.tab === "categories") renderCategories(m);
  $("#cnt-products").textContent = DB.menu.length;
  $("#cnt-categories").textContent = DB.cats.length;
  $("#cnt-orders").textContent = DB.orders.length;
}

function renderHome(m) {
  m.innerHTML = `
    <div class="welcome-card"><h1>¡Hola, Admin!</h1><p>Bienvenido a ${DB.config.brand || 'tu negocio'}.</p></div>
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-icon" style="background:var(--brand-soft);color:var(--brand)">🍔</div><div class="stat-info"><p>Productos</p><h3>${DB.menu.length}</h3></div></div>
      <div class="stat-card"><div class="stat-icon" style="background:#DCFCE7;color:#16A34A">🧾</div><div class="stat-info"><p>Pedidos</p><h3>${DB.orders.length}</h3></div></div>
    </div>`;
}

function renderProducts(m) {
  m.innerHTML = `<div class="page-head"><div><h1 class="page-title">Productos</h1></div><button class="btn btn-primary">＋ Nuevo</button></div>
    <div class="p-list">${DB.menu.map(p => `<div class="p-card"><div class="p-thumb">${p.emoji}</div><div class="p-info"><h4>${p.name}</h4><p>${p.desc}</p><b style="color:var(--brand)">$${p.price}</b></div></div>`).join("")}</div>`;
}

function renderOrders(m) {
  m.innerHTML = `<h1 class="page-title">Pedidos</h1>` + (DB.orders.length === 0 ? `<div class="empty">Sin pedidos</div>` : DB.orders.map(o => `<div class="card" style="margin-bottom:10px;padding:16px"><b>${o.code}</b> - ${o.customer.name} - $${o.total}</div>`).join(""));
}

function renderCategories(m) { m.innerHTML = `<h1 class="page-title">Categorías</h1>`; }
function renderBusiness(m) { m.innerHTML = `<h1 class="page-title">Negocio</h1>`; }

/* SECCIÓN DE REPORTES (BOTONES VERTICALES) */
function renderReports(m) {
  const hoy = new Date();
  const primerDia = new Date(hoy.getFullYear(), hoy.getMonth(), 1).toISOString().split('T')[0];
  const ultimoDia = hoy.toISOString().split('T')[0];

  m.innerHTML = `
    <div class="page-head"><div><h1 class="page-title">Reportes</h1><p class="page-sub">Analiza el rendimiento de tu negocio.</p></div></div>
    <div class="card" style="margin-bottom:24px">
      <div class="card-body">
        <div class="report-filters">
          <div class="field"><label>Desde</label><input type="date" id="rep-start" value="${primerDia}"></div>
          <div class="field"><label>Hasta</label><input type="date" id="rep-end" value="${ultimoDia}"></div>
          <button class="btn btn-primary" onclick="generarReporte()">Generar</button>
        </div>
        
        <!-- BOTONES EN VERTICAL -->
        <div class="report-actions" id="rep-actions" style="display:none">
          <button class="btn btn-ghost" onclick="exportarCSV()">📊 Descargar Excel/CSV</button>
          <button class="btn btn-ghost" onclick="window.print()">📄 Guardar como PDF</button>
        </div>
      </div>
    </div>
    <div id="report-content"></div>
  `;
}

function generarReporte() {
  const start = new Date(document.getElementById("rep-start").value + "T00:00:00");
  const end = new Date(document.getElementById("rep-end").value + "T23:59:59");
  const filtered = DB.orders.filter(o => { const d = new Date(o.created_at); return d >= start && d <= end; });

  let totalIngresos = 0; let clientesSet = new Set();
  let productosVendidos = {};

  filtered.forEach(o => {
    totalIngresos += Number(o.total);
    if (o.customer && o.customer.phone) clientesSet.add(o.customer.phone);
    if (o.items) o.items.forEach(it => {
      if (!productosVendidos[it.name]) productosVendidos[it.name] = { qty: 0, total: 0 };
      productosVendidos[it.name].qty += it.qty;
      productosVendidos[it.name].total += (it.unit * it.qty);
    });
  });

  document.getElementById("rep-actions").style.display = "flex";
  document.getElementById("report-content").innerHTML = `
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-icon" style="background:var(--ok-soft);color:var(--ok)">💰</div><div class="stat-info"><p>Ingresos</p><h3>$${totalIngresos.toFixed(2)}</h3></div></div>
      <div class="stat-card"><div class="stat-icon" style="background:#E0F2FE;color:#0284C7">🧾</div><div class="stat-info"><p>Pedidos</p><h3>${filtered.length}</h3></div></div>
      <div class="stat-card"><div class="stat-icon" style="background:var(--brand-soft);color:var(--brand)">👥</div><div class="stat-info"><p>Clientes</p><h3>${clientesSet.size}</h3></div></div>
    </div>
    <div class="card"><div class="card-body">
      <div class="card-title">Productos más vendidos</div>
      <table class="report-table"><thead><tr><th>Producto</th><th>Cant.</th><th>Ingreso</th></tr></thead><tbody>
        ${Object.keys(productosVendidos).sort((a,b)=>productosVendidos[b].qty - productosVendidos[a].qty).map(name => `
          <tr><td><b>${name}</b></td><td>${productosVendidos[name].qty}</td><td>$${productosVendidos[name].total.toFixed(2)}</td></tr>
        `).join("")}
      </tbody></table>
    </div></div>
  `;
  window.currentReportData = filtered;
}

function exportarCSV() {
  if (!window.currentReportData || !window.currentReportData.length) return toast("No hay datos");
  let csv = "Codigo,Fecha,Cliente,Telefono,Pago,Total\n";
  window.currentReportData.forEach(o => {
    csv += `"${o.code}","${new Date(o.created_at).toLocaleString()}","${o.customer.name}","${o.customer.phone}","${o.payment}",${o.total}\n`;
  });
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `Reporte_${new Date().toISOString().slice(0,10)}.csv`; a.click();
  toast("✅ Descargado");
}

document.addEventListener("DOMContentLoaded", () => {
  checkAuth();
  document.getElementById("loginPass").addEventListener("keydown", e => { if(e.key === "Enter") doLogin(); });
});
</script>
</body>
</html>
