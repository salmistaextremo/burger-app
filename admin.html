<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel Admin — DLV Food</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png">
<meta name="theme-color" id="metaThemeColor" content="#FF5A1F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#F5F6F8; --surface:#FFFFFF; --surface-2:#F0F1F4;
  --line:#E5E7EB; --line-2:#D1D5DB;
  --ink:#111827; --ink-2:#374151; --muted:#6B7280; --muted-2:#9CA3AF;
  --brand:#FF5A1F; --brand-2:#FF7A45; --brand-d:#E0440F; --brand-soft:#FFF0EA;
  --ok:#10B981; --ok-soft:#ECFDF5;
  --danger:#EF4444; --danger-soft:#FEF2F2;
  --star:#F59E0B; --star-bg:#FFFBEB; --star-line:#FEF3C7;
  --r:12px; --r-lg:16px;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --shadow-lg:0 20px 50px rgba(0,0,0,.15);
}
*{margin:0;padding:0}
html,body{background:var(--bg);font-family:'Inter',sans-serif;color:var(--ink);min-height:100vh}
button, a.nav-link-btn{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:14px;width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);outline:none;transition:.15s}
input:focus,textarea:focus,select:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
textarea{resize:vertical;min-height:80px}
.hidden{display:none !important}

.btn-header-support {
  color: var(--ok); font-size: 11px; font-weight: 700;
  padding: 6px 8px; border-radius: 8px; background: var(--ok-soft);
  text-decoration: none; display: none; align-items: center; gap: 4px;
}

.notif-banner{display:flex;background:var(--brand);color:#fff;padding:12px 20px;text-align:center;font-size:14px;font-weight:600;align-items:center;justify-content:center;gap:10px;cursor:pointer;position:relative;z-index:1000;transition:.3s;}
.notif-banner:hover{background:var(--brand-d);}
.notif-banner.hidden{display:none !important;}

.auth-screen{position:fixed;inset:0;z-index:999;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
.auth-box{background:var(--surface);width:100%;max-width:400px;border-radius:20px;padding:32px 24px;box-shadow:var(--shadow-lg);text-align:center}
.auth-logo{width:60px;height:60px;border-radius:16px;background:linear-gradient(135deg,var(--brand-2),var(--brand));display:grid;place-items:center;font-size:30px;margin:0 auto 16px;color:#fff}
.auth-box h2{margin:0 0 8px;font-size:22px;font-weight:800;}
.auth-box p{margin:0 0 24px;font-size:13.5px;color:var(--muted);}
.auth-box .field{margin-bottom:16px;text-align:left}
.auth-box .btn{width:100%;margin-bottom:12px}
.auth-error{background:var(--danger-soft);color:var(--danger);padding:10px;border-radius:8px;font-size:12.5px;font-weight:600;margin-bottom:16px;display:none}

.app{display:flex;min-height:100vh}
.sidebar{width:240px;background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;flex:none;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.sb-brand{display:flex;align-items:center;gap:10px;padding:8px 10px 20px;border-bottom:1px solid var(--line);margin-bottom:12px}
.sb-logo{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:18px;background:linear-gradient(135deg,var(--brand-2),var(--brand));color:#fff;overflow:hidden;position:relative; flex-shrink: 0;}
.sb-logo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sb-brand-text h1{font-size:14px;font-weight:800;}
.sb-brand-text p{font-size:11px;color:var(--muted);margin-top:1px}

.sb-nav{display:flex;flex-direction:column;gap:3px;flex:1;overflow-y:auto;scrollbar-width:none;}
.sb-nav::-webkit-scrollbar {display: none;}
.sb-nav button, .sb-nav a.nav-link-btn{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:10px;font-size:13.5px;font-weight:500;color:var(--ink-2);text-align:left;transition:.15s;flex-shrink:0;text-decoration:none;}
.sb-nav button .ico, .sb-nav a.nav-link-btn .ico{font-size:17px;width:20px;text-align:center}
.sb-nav button:hover, .sb-nav a.nav-link-btn:hover{background:var(--surface-2);color:var(--ink)}
.sb-nav button.active{background:var(--brand-soft);color:var(--brand-d);font-weight:600}
.sb-nav button .count{margin-left:auto;font-size:11px;font-weight:700;background:var(--surface-2);color:var(--muted);padding:2px 7px;border-radius:99px}
.sb-nav button.active .count{background:var(--brand);color:#fff}
.sb-nav button .count.new{background:var(--danger);color:#fff;animation:pulse-badge 2s infinite;}
@keyframes pulse-badge{0%{transform:scale(1)}50%{transform:scale(1.15)}100%{transform:scale(1)}}

.sb-footer{padding-top:12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.sb-footer a,.sb-footer button{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;font-size:13px;font-weight:500;color:var(--ink-2);text-decoration:none;transition:.15s}
.sb-footer a:hover,.sb-footer button:hover{background:var(--surface-2);color:var(--ink)}
.sb-footer .logout-btn{color:var(--danger)}
.sb-footer .logout-btn:hover{background:var(--danger-soft)}

.main{flex:1;padding:32px 40px;max-width:1200px}
.page-title{margin-bottom:4px;font-size:26px;font-weight:900;letter-spacing:-.8px}
.page-sub{color:var(--muted);font-size:13.5px;margin-bottom:24px;line-height:1.5}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.page-head .btn-primary{flex:none}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:11px;font-size:13.5px;font-weight:600;transition:.15s;white-space:nowrap;text-decoration:none;}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,var(--brand-2),var(--brand));color:#fff;box-shadow:0 4px 12px var(--brand-soft)}
.btn-ghost{background:var(--surface);border:1px solid var(--line);color:var(--ink-2)}
.btn-ghost:hover{background:var(--surface-2);border-color:var(--line-2)}
.btn-danger{background:var(--danger-soft);color:var(--danger);border:1px solid #FECACA}
.btn-sm{padding:7px 12px;font-size:12.5px;border-radius:9px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.card-body{padding:20px}
.card-title{font-size:15px;font-weight:700;margin-bottom:4px}
.card-desc{font-size:12.5px;color:var(--muted);margin-bottom:16px;line-height:1.55}

.welcome-card{background:linear-gradient(135deg, var(--brand-2), var(--brand));color:#fff;border-radius:20px;padding:28px;margin-bottom:24px;box-shadow:0 10px 30px var(--brand-soft); overflow:hidden;}
.welcome-card h1{margin:0 0 8px;font-size:clamp(20px, 5vw, 26px);font-weight:900;letter-spacing:-.8px; word-break:break-all; overflow-wrap:anywhere; line-height:1.2;}
.welcome-card p{margin:0;font-size:15px;opacity:.9}

.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:32px}
.stat-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;align-items:center;gap:16px;box-shadow:var(--shadow)}
.stat-icon{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;font-size:24px;flex:none}
.stat-info p{margin:0;font-size:12.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.stat-info h3{margin:4px 0 0;font-size:24px;font-weight:900;color:var(--ink)}

.report-filters{display:flex;gap:16px;align-items:flex-end;margin-bottom:24px;flex-wrap:wrap}
.report-filters .field{margin:0;flex:1;min-width:150px}
.report-actions{display:flex;gap:10px;margin-bottom:24px}
.report-table{width:100%;border-collapse:collapse;margin-top:16px;font-size:13.5px}
.report-table th{text-align:left;padding:12px;border-bottom:2px solid var(--line);color:var(--muted);font-weight:700}
.report-table td{padding:12px;border-bottom:1px solid var(--line);color:var(--ink-2)}
.report-table tr:hover td{background:var(--surface-2)}

.p-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.p-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;gap:12px;padding:12px;transition:.15s;box-shadow:var(--shadow); position:relative;}
.p-card.unavailable { opacity: 0.6; filter: grayscale(0.8); }
.p-thumb{width:70px;height:70px;border-radius:10px;background:var(--surface-2);flex:none;display:grid;place-items:center;font-size:30px;overflow:hidden;position:relative;border:1px solid var(--line)}
.p-thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.p-info{flex:1;min-width:0;display:flex;flex-direction:column}
.p-info h4{font-size:14px;font-weight:700;margin-bottom:3px}
.p-info p{font-size:11.5px;color:var(--muted);line-height:1.4;margin-bottom:6px}
.p-meta{display:flex;align-items:center;gap:8px;margin-top:auto}
.p-price{font-size:14px;font-weight:800;color:var(--brand)}
.p-actions{margin-left:auto;display:flex;gap:4px;flex:none; align-items:center;}
.p-actions button{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:14px;background:var(--surface-2);color:var(--muted);transition:.15s}
.p-actions button:hover { background: var(--line); color: var(--ink); }
.p-actions button.btn-toggle-avail { width: auto; padding: 0 8px; font-size: 12px; font-weight: 700; border-radius: 6px; }
.p-actions button.btn-toggle-avail.avail { background: var(--ok-soft); color: var(--ok); }
.p-actions button.btn-toggle-avail.unavail { background: var(--danger-soft); color: var(--danger); }

.modal{position:fixed;inset:0;z-index:100;background:rgba(17,24,39,.5);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:20px}
.modal-box{background:var(--surface);border-radius:20px;width:100%;max-width:640px;max-height:92vh;display:flex;flex-direction:column;box-shadow:var(--shadow-lg)}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--line);flex:none}
.modal-head h2{font-size:17px;font-weight:800}
.modal-close{width:34px;height:34px;border-radius:9px;font-size:16px;color:var(--muted);display:grid;place-items:center}
.modal-body{padding:24px;overflow-y:auto;flex:1}
.modal-foot{padding:16px 24px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex:none}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form-grid .full{grid-column:1/-1}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;font-weight:600;margin-bottom:6px;color:var(--ink-2)}

.emoji-input-box { width: 60px; height: 60px; font-size: 30px; text-align: center; cursor: pointer; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); transition: 0.2s; display: flex; align-items: center; justify-content: center; padding: 0; }
.emoji-input-box:hover { border-color: var(--brand); background: var(--brand-soft); }

.emoji-window { position: fixed; inset: 0; z-index: 200; background: rgba(17,24,39,.6); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; padding: 20px; animation: fadeIn 0.2s ease; }
.emoji-window-box { background: var(--surface); border-radius: 20px; width: 100%; max-width: 400px; box-shadow: var(--shadow-lg); display: flex; flex-direction: column; overflow: hidden; }
.emoji-window-head { padding: 16px 20px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
.emoji-window-head h3 { margin: 0; font-size: 16px; font-weight: 800; }
.emoji-grid { padding: 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(50px, 1fr)); gap: 8px; max-height: 350px; overflow-y: auto; scrollbar-width: thin; }
.emoji-grid button { font-size: 26px; height: 50px; display: flex; align-items: center; justify-content: center; background: var(--surface-2); border: 1px solid transparent; border-radius: 10px; cursor: pointer; transition: 0.2s; }
.emoji-grid button:hover { background: var(--brand-soft); border-color: var(--brand); transform: scale(1.1); }

.day-picker { display: flex; gap: 6px; flex-wrap: wrap; }
.day-picker label { flex: 1; text-align: center; padding: 10px 0; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); cursor: pointer; font-size: 13px; font-weight: 600; color: var(--muted); transition: 0.2s; margin: 0; }
.day-picker input { display: none; }
.day-picker input:checked + span { color: var(--brand-d); }
.day-picker label:has(input:checked) { background: var(--brand-soft); border-color: var(--brand); color: var(--brand-d); }

.img-picker{position:relative;width:100%;height:200px;background:var(--surface-2);border:2px dashed var(--line-2);border-radius:var(--r);display:grid;place-items:center;overflow:hidden;cursor:pointer;}
.img-picker input{display:none}
.img-picker img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.img-picker .placeholder{text-align:center;color:var(--muted)}

.extra-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
.extra-row input:first-child{flex:2}
.extra-row input:nth-child(2){flex:1;max-width:110px}
.extra-row button{width:36px;height:36px;border-radius:9px;background:var(--danger-soft);color:var(--danger);flex:none;display:grid;place-items:center;}

.pay-list{display:flex;flex-direction:column;gap:10px}
.pay-item{display:flex;gap:14px;align-items:center;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);}
.pay-icon{width:46px;height:46px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;font-size:22px;flex:none;}
.pay-body{flex:1;min-width:0}
.pay-body h4{font-size:14px;font-weight:700;}
.pay-actions button{width:32px;height:32px;border-radius:8px;background:var(--surface-2);color:var(--muted);}

.cat-list{display:flex;flex-direction:column;gap:8px}
.cat-row{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);}
.cat-icon{width:44px;height:44px;border-radius:11px;background:var(--surface-2);display:grid;place-items:center;font-size:22px;}
.cat-info{flex:1;}
.cat-info h4{font-size:14px;font-weight:700;}
.cat-actions button{width:32px;height:32px;border-radius:8px;background:var(--surface-2);color:var(--muted);}

.order-list{display:flex;flex-direction:column;gap:10px}
.order-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;transition: all 0.3s ease;}
.order-card.pending { background: var(--brand-soft); border: 1px solid var(--brand); border-left: 6px solid var(--brand); box-shadow: 0 4px 12px var(--brand-soft); }
.order-head{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
.order-code{font-size:18px;font-weight:900;color:var(--brand);}
.order-status{font-size:10.5px;font-weight:700;padding:4px 9px;border-radius:6px;text-transform:uppercase;}
.order-date{margin-left:auto;font-size:11.5px;color:var(--muted);}
.order-customer{font-size:13px;line-height:1.6;margin-bottom:10px;}
.order-items{background:var(--surface-2);border-radius:10px;padding:12px;font-size:12.5px;}
.order-card.pending .order-items { background: #FFFFFF; }
.order-total{display:flex;justify-content:space-between;font-weight:800;margin-top:8px;border-top:1px solid var(--line);padding-top:8px;}

.order-review { margin-top: 12px; padding: 12px; background: var(--star-bg); border: 1px solid var(--star-line); border-radius: 10px; animation: fadeIn 0.4s ease; }
.order-review .stars { color: var(--star); font-size: 16px; letter-spacing: 2px; margin-bottom: 4px; }
.order-review .comment { font-size: 13px; color: var(--ink-2); font-style: italic; line-height: 1.4; }

.proof-btn { display: inline-flex; align-items: center; justify-content: center; padding: 4px 10px; border-radius: 6px; background: var(--brand-soft); color: var(--brand); font-size: 11.5px; font-weight: 700; margin-left: 8px; transition: 0.2s; cursor: pointer; border: 1px solid var(--brand-soft); text-decoration: none; }
.proof-btn:hover { background: var(--brand); color: #fff; }

.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);z-index:200;background:var(--ink);color:#fff;padding:13px 22px;border-radius:11px;font-size:13.5px;opacity:0;pointer-events:none;transition:.3s;box-shadow:var(--shadow-lg);}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

.empty{text-align:center;padding:60px 20px;color:var(--muted);}
.empty .big{font-size:52px;opacity:.35;margin-bottom:14px;}

/* =========================================
   ESTADOS DE CARGA, VACÍO Y ERROR
   ========================================= */
.state-container { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 20px; text-align: center; animation: fadeIn 0.3s ease; width: 100%; }
.state-icon { font-size: 56px; margin-bottom: 16px; opacity: 0.8; }
.state-title { font-size: 18px; font-weight: 800; color: var(--ink); margin-bottom: 8px; }
.state-desc { font-size: 14px; color: var(--muted); margin-bottom: 24px; max-width: 300px; line-height: 1.5; }
.btn-retry { background: var(--surface-2); color: var(--brand); border: 1px solid var(--line); padding: 12px 24px; border-radius: 12px; font-weight: 700; cursor: pointer; transition: 0.2s; }
.btn-retry:hover { background: var(--brand-soft); border-color: var(--brand); }
.skeleton { background: var(--line); border-radius: 8px; animation: pulse-bg 1.5s infinite ease-in-out; }
@keyframes pulse-bg { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.skeleton-card { height: 100px; border-radius: 20px; margin-bottom: 16px; }
.skeleton-img { height: 160px; border-radius: 20px 20px 0 0; margin-bottom: 12px; }
.skeleton-text { height: 16px; margin-bottom: 8px; width: 80%; }
.skeleton-text.short { width: 50%; }

@media(max-width:860px){
  .app{flex-direction:column}
  .sidebar{ width:100%; height:auto; position:sticky; top:0; z-index:100; flex-direction:column; padding:0; border-right:none; border-bottom:1px solid var(--line); background:var(--surface); }
  .sb-brand{ display:flex; justify-content:space-between; align-items:center; padding:12px 16px; margin:0; border:none; }
  .sb-brand-text { margin-right: auto; margin-left: 10px; }
  .sb-brand-text h1{font-size:15px;}
  .sb-brand-text p{font-size:11px;}
  .sb-brand-actions { display: flex; gap: 6px; align-items: center; }
  .btn-header-support { display: flex; }
  .btn-header-install { color: var(--brand-d); font-size: 11px; font-weight: 700; padding: 6px 8px; border-radius: 8px; background: var(--brand-soft); display: block; }
  .btn-header-logout { color: var(--danger); font-size: 11px; font-weight: 700; padding: 6px 8px; border-radius: 8px; background: var(--danger-soft); }
  .sb-nav{ display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 0 12px 16px; overflow: visible; flex: none; }
  .sb-nav button, .sb-nav a.nav-link-btn{ flex-direction: column; justify-content: center; padding: 10px 4px; background: var(--surface-2); border-radius: 12px; font-size: 10px; font-weight: 600; white-space: normal; text-align: center; position: relative; line-height: 1.2; }
  .sb-nav button .ico, .sb-nav a.nav-link-btn .ico{ font-size: 22px; margin-bottom: 4px; width: auto; }
  .sb-nav button .count{ position: absolute; top: 6px; right: 6px; margin: 0; padding: 2px 5px; font-size: 9px; min-width: 16px; height: 16px; }
  .sb-nav button.active{ background: var(--brand); color: #fff; }
  .sb-nav button.active .count{ background: #fff; color: var(--brand); }
  .sb-footer{display:none;}
  .main{padding:16px;}
  .welcome-card{padding:20px; margin-bottom:16px;}
  .welcome-card h1{font-size:22px; word-break:break-all;}
  .stats-grid{grid-template-columns:1fr 1fr; gap:12px; margin-bottom:24px;}
  .stat-card{flex-direction:column; align-items:flex-start; padding:16px;}
  .stat-icon{width:40px; height:40px; font-size:20px; margin-bottom:8px;}
  .stat-info h3{font-size:20px;}
  .p-list{grid-template-columns:1fr;}
  .report-filters{flex-direction:column; align-items:stretch;}
  .form-grid{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<div id="notifBanner" class="notif-banner hidden" onclick="unlockNotifications()">
  🔔 Haz clic aquí para activar las notificaciones y sonidos de nuevos pedidos
</div>

<div id="authScreen" class="auth-screen">
  <div id="loginBox" class="auth-box">

function applyBrandColors(baseColor) {
  if (!baseColor || !baseColor.startsWith('#')) baseColor = '#FF5A1F';
  document.documentElement.style.setProperty('--brand', baseColor);
  document.documentElement.style.setProperty('--brand-soft', baseColor + '1A');
  
  let r = parseInt(baseColor.slice(1, 3), 16);
  let g = parseInt(baseColor.slice(3, 5), 16);
  let b = parseInt(baseColor.slice(5, 7), 16);
  
  let rDark = Math.max(0, Math.floor(r * 0.8));
  let gDark = Math.max(0, Math.floor(g * 0.8));
  let bDark = Math.max(0, Math.floor(b * 0.8));
  document.documentElement.style.setProperty('--brand-d', `#${rDark.toString(16).padStart(2, '0')}${gDark.toString(16).padStart(2, '0')}${bDark.toString(16).padStart(2, '0')}`);
  
  let rLight = Math.min(255, Math.floor(r + (255 - r) * 0.2));
  let gLight = Math.min(255, Math.floor(g + (255 - g) * 0.2));
  let bLight = Math.min(255, Math.floor(b + (255 - b) * 0.2));

  }
}

function readCachedRate() {
  try {
    const raw = localStorage.getItem('ff_exchange_rate');
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (typeof parsed === 'number' && parsed > 0) return { rate: parsed, ts: 0 };
    if (parsed && Number(parsed.rate) > 0) return { rate: Number(parsed.rate), ts: Number(parsed.ts) || 0 };
  } catch (e) {}
  return null;
}

function saveRate(rate) {
  EXCHANGE_RATE = rate;
  try { localStorage.setItem('ff_exchange_rate', JSON.stringify({ rate: rate, ts: Date.now() })); } catch (e) {}
}

async function fetchExchangeRate() {
  if (DB.config.manualRate && Number(DB.config.manualRate) > 0) { EXCHANGE_RATE = Number(DB.config.manualRate); return; }

  // Reutiliza la última tasa conocida (la comparte con la app cliente, mismo origen).
  const cached = readCachedRate();
  if (cached) EXCHANGE_RATE = cached.rate;

  const fetchJson = async (url) => {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 5000);
    try {
      const res = await fetch(url, { signal: ctrl.signal, cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return await res.json();
    } finally { clearTimeout(timer); }
  };

  // pydolarve.org ya no resuelve (NXDOMAIN). DolarAPI es la fuente viva y permite CORS.
  try {
    const data = await fetchJson("https://ve.dolarapi.com/v1/dolares/oficial");
    const price = parseFloat(data && data.promedio);
    if (isFinite(price) && price > 0) { saveRate(price); return; }
  } catch (e) { console.warn("Tasa oficial no disponible:", e.message); }

  try {
    const list = await fetchJson("https://ve.dolarapi.com/v1/dolares");
    if (Array.isArray(list)) {
      const oficial = list.find(x => x && x.fuente === 'oficial' && Number(x.promedio) > 0);
      const item = oficial || list.find(x => x && Number(x.promedio) > 0);
      if (item) { saveRate(Number(item.promedio)); return; }
    }
  } catch (e) { console.warn("Lista de tasas no disponible:", e.message); }

  // Sin tasa fresca: se mantiene la cacheada o queda en null. No se inventa una tasa.
  if (!EXCHANGE_RATE) EXCHANGE_RATE = null;
}

function urlBase64ToUint8Array(base64String) {
  var padding = '='.repeat((4 - base64String.length % 4) % 4);
  var base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  var raw = atob(base64);
  var output = new Uint8Array(raw.length);
  for (var i = 0; i < raw.length; i++) output[i] = raw.charCodeAt(i);
  return output;
}

async function subscribeToPush(registration) {
  var vapid = window.APP_CONFIG && window.APP_CONFIG.vapidPublicKey;
  if (!vapid) return 'Falta la clave VAPID en app-config.js';
  if (!('PushManager' in window)) return 'Este navegador no soporta Web Push';

  try {
    var sub = await registration.pushManager.getSubscription();
    if (!sub) {
      sub = await registration.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(vapid)
      });
    }
    var json = sub.toJSON();
    var res = await supabaseClient.from('push_subscriptions').upsert({
      endpoint: json.endpoint,
      p256dh: json.keys.p256dh,
      auth: json.keys.auth,
      user_agent: (navigator.userAgent || '').slice(0, 250),
      last_seen_at: new Date().toISOString()
    }, { onConflict: 'endpoint' });
    if (res.error) {
      console.warn('No se guardó la suscripción push:', res.error);
      return 'Supabase: ' + (res.error.message || res.error.code);
    }
    return true;
  } catch (e) {
    console.warn('No se pudo suscribir a push:', e);
    return 'Suscripción: ' + (e && e.message ? e.message : e);
  }
}

async function setupPushNotifications(requestPermission) {
  if (!('serviceWorker' in navigator)) return 'Sin service worker';
  if (!('Notification' in window)) return 'Sin API de notificaciones';
  if (!('PushManager' in window)) return 'Web Push no soportado (en iPhone, instala la app en inicio)';

  try {
    var registration = await navigator.serviceWorker.register('/sw.js');
    var permission = Notification.permission;
    if (permission !== 'granted' && requestPermission) {
      permission = await Notification.requestPermission();
    }
    if (permission !== 'granted') return 'Permiso de notificaciones no concedido';

    notificationsEnabled = true;
    var result = await subscribeToPush(registration);
    if (result === true && requestPermission) toast("✅ Notificaciones push activadas");
    return result;
  } catch (error) {
    console.error('Error Service Worker/Push:', error);
    return 'Error: ' + (error && error.message ? error.message : error);
  }
}

function getAudioCtx() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
  }
  if (audioCtx.state === 'suspended') { audioCtx.resume().catch(function () {}); }
  return audioCtx;
}

// Campanilla de servicio: fundamental + parciales inarmónicos + golpe metálico.
function playServiceBell() {
  var ctx = getAudioCtx();
  if (!ctx) return;

  try {
    var now = ctx.currentTime + 0.02;
    var master = ctx.createGain();
    master.gain.value = 0.9;
    var comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -14;
    comp.knee.value = 20;
    comp.ratio.value = 4;
    comp.attack.value = 0.003;
    comp.release.value = 0.25;
    master.connect(comp);
    comp.connect(ctx.destination);

    var partials = [
      { r: 1.00, a: 1.00, d: 1.9 },
      { r: 2.00, a: 0.45, d: 1.4 },
      { r: 2.40, a: 0.30, d: 1.1 },
      { r: 3.00, a: 0.20, d: 0.8 },
      { r: 4.50, a: 0.10, d: 0.5 },
      { r: 5.33, a: 0.07, d: 0.4 }
    ];

    function strike(t, base, level) {
      partials.forEach(function (p) {
        var osc = ctx.createOscillator();
        var g = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(base * p.r, t);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(Math.max(0.0002, level * p.a), t + 0.005);
        g.gain.exponentialRampToValueAtTime(0.0001, t + p.d);
        osc.connect(g);
        g.connect(master);
        osc.start(t);
        osc.stop(t + p.d + 0.05);
      });

      var len = Math.floor(ctx.sampleRate * 0.03);
      var buffer = ctx.createBuffer(1, len, ctx.sampleRate);
      var data = buffer.getChannelData(0);
      for (var i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 4);
      var src = ctx.createBufferSource();
      src.buffer = buffer;
      var hp = ctx.createBiquadFilter();
      hp.type = 'highpass';
      hp.frequency.value = 2500;
      var ng = ctx.createGain();
      ng.gain.value = 0.22 * level;
      src.connect(hp);
      hp.connect(ng);
      ng.connect(master);
      src.start(t);
    }

    strike(now, 1046.5, 0.55);
    strike(now + 0.22, 1046.5, 0.40);

    if (navigator.vibrate) navigator.vibrate([120, 60, 120]);
  } catch (e) {
    console.warn('Audio error:', e);
  }
}

function playNotificationSound() { playServiceBell(); }

async function unlockNotifications() {
  getAudioCtx();
  playNotificationSound();

  if (!('Notification' in window)) { toast('Este navegador no soporta notificaciones'); return; }
  if (Notification.permission === 'denied') {
    toast('Bloqueaste las notificaciones. Habilítalas en el candado del navegador.');
    return;
  }

  var permission = Notification.permission;
  if (permission !== 'granted') {
    try { permission = await Notification.requestPermission(); } catch (e) { permission = 'denied'; }
  }
  if (permission !== 'granted') { toast('No diste permiso para las notificaciones'); return; }

  var result = await setupPushNotifications(false);
  if (result === true) {
    document.getElementById("notifBanner").classList.add("hidden");
    localStorage.setItem('admin_notif_unlocked', 'true');
    notificationsEnabled = true;
  } else {
    toast('❌ ' + result);
  }
}

async function checkNotificationState() {
  const hasPermission = "Notification" in window && Notification.permission === "granted";
  let hasSubscription = false;
  if (hasPermission && 'serviceWorker' in navigator) {
    try {
      const reg = await navigator.serviceWorker.ready;
      hasSubscription = !!(await reg.pushManager.getSubscription());
    } catch (e) {}
  }

  const banner = document.getElementById("notifBanner");
  if (hasPermission && hasSubscription) {
    notificationsEnabled = true;
    if (banner) banner.classList.add("hidden");
    if (!audioCtx) getAudioCtx();
  } else {
    if (banner) banner.classList.remove("hidden");
  }
}

async function dbLoad() {
  try {
    const [configRes, catsRes, productsRes, ordersRes] = await Promise.all([
      supabaseClient.from('config').select('*').eq('id', 1).single(),
      supabaseClient.from('categories').select('*'),
      supabaseClient.from('products').select('*'),
      supabaseClient.from('orders').select('*').order('created_at', { ascending: false })
    ]);

    const firstError = configRes.error || catsRes.error || productsRes.error || ordersRes.error;
    if (firstError && firstError.code !== 'PGRST116') {
      throw new Error('Supabase: ' + (firstError.message || firstError.code));
    }

    if (configRes.data) {
      const config = configRes.data;
      DB.config = { 
        ...DEFAULT_CONFIG, 
        ...config, 
        phoneCall: config.phonecall, 
        mapsUrl: config.mapsurl, 
        deliveryFee: config.deliveryfee, 
        freeDeliveryFrom: config.freedeliveryfrom, 
        helpHoursText: config.helphourstext, 
        manualRate: config.manual_rate || 0,
        primary_color: config.primary_color || '#FF5A1F',
        bg_color: config.bg_color || '#F5F6F8'
      };
      if (!DB.config.payments) DB.config.payments = DEFAULT_CONFIG.payments;
      if (!DB.config.hours) DB.config.hours = DEFAULT_CONFIG.hours;
      if (!DB.config.days) DB.config.days = DEFAULT_CONFIG.days;
    } else {
      DB.config = JSON.parse(JSON.stringify(DEFAULT_CONFIG));
      await supabaseClient.from('config').insert([{ id: 1, brand: DB.config.brand }]);
    }

    if (catsRes.data) DB.cats = catsRes.data.map(c => ({ ...c, id: String(c.id) }));
    if (productsRes.data) DB.menu = productsRes.data.map(p => ({ ...p, cat: String(p.category_id), desc: p.description, extras: p.extras || [], available: p.available !== false }));
    if (ordersRes.data) DB.orders = ordersRes.data;
    
    updateAppBadge();
  } catch(e) { 
    console.error(e); 
    throw e;
  }
}

async function dbSaveMenu() {
  if (!DB.menu.length) return;
  const payload = DB.menu.map(p => ({
    ...(p.id && !p.id.startsWith('temp-') ? { id: p.id } : {}),
    category_id: p.cat, name: p.name, price: p.price, emoji: p.emoji,
    badge: p.badge || null, img: p.img || null, description: p.desc,
    extras: p.extras, available: p.available !== false
  }));
  const { data, error } = await supabaseClient.from('products').upsert(payload, { onConflict: 'id', defaultToNull: false }).select();
  if (error) throw error;
  if (data) DB.menu = data.map(p => ({ ...p, cat: String(p.category_id), desc: p.description, extras: p.extras || [], available: p.available !== false }));
}

async function dbUpdateOrderStatus(orderId, newStatus) {
  const { error } = await supabaseClient.from('orders').update({ status: newStatus }).eq('id', orderId);
  if (!error) {
    const order = DB.orders.find(o => o.id === orderId);
    if (order) order.status = newStatus;
    toast("✅ Estado actualizado y enviado al cliente");
    updateAppBadge();
    render();
  } else {
    toast("Error al actualizar estado", "error");
  }
}

function setupOrderListener() {
  if (window.adminOrderChannel) { supabaseClient.removeChannel(window.adminOrderChannel); window.adminOrderChannel = null; }
  
  window.adminOrderChannel = supabaseClient.channel('admin-orders')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'orders' }, payload => {
      const newOrder = payload.new;
      playNotificationSound();
      if ('serviceWorker' in navigator && Notification.permission === 'granted') {
        navigator.serviceWorker.ready.then(registration => {
          registration.showNotification('🔔 ¡Nuevo Pedido!', {
            body: `Pedido ${newOrder.code} de ${newOrder.customer.name}\nTotal: $${newOrder.total}`,
            icon: logoIconUrl(),
            vibrate: [200, 100, 200, 100, 200, 100, 200],
            requireInteraction: true, tag: 'nuevo-pedido'
          });
        });
      }
      toast(`🔔 ¡Nuevo Pedido ${newOrder.code}!`);
      dbLoad().then(() => {
        updateAppBadge();
        if (state.tab === 'orders' || state.tab === 'home') render();
      }).catch(function (e) { console.warn('Sync:', e.message); });
    })
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'orders' }, payload => {
      const updatedOrder = payload.new;
      const index = DB.orders.findIndex(o => o.id === updatedOrder.id);
      if (index !== -1) {
        DB.orders[index] = { ...DB.orders[index], ...updatedOrder };
      } else {
        DB.orders.unshift(updatedOrder);
      }

      if (updatedOrder.rating) {
        playNotificationSound();
        if ('serviceWorker' in navigator && Notification.permission === 'granted') {
          navigator.serviceWorker.ready.then(registration => {
            registration.showNotification('⭐ ¡Cliente ha calificado!', {
              body: `Pedido ${updatedOrder.code}: ${updatedOrder.rating} estrellas.\n"${updatedOrder.review_text || 'Sin comentario'}"`,
              icon: logoIconUrl(),
              vibrate: [200, 100, 200],
              requireInteraction: true, tag: 'nueva-calificacion'
            });
          });
        }
        toast(`⭐ ¡Pedido ${updatedOrder.code} calificado con ${updatedOrder.rating} estrellas!`);
      }

      if (state.tab === 'orders') renderOrders($("#main"));
      else if (state.tab === 'home') renderHome($("#main"));
      updateAppBadge();
    })
    .subscribe();
}

function handleAppVisibility() {
  if (!supabaseClient) return;
  if (document.visibilityState === 'visible') {
    dbLoad().then(() => {
      setupOrderListener();
      if (state.tab === 'orders') renderOrders($("#main"));
      else if (state.tab === 'home') renderHome($("#main"));
      else render(); 
      toast("🔄 Datos sincronizados");
    }).catch(function (e) { console.warn('Sync:', e.message); });
  }
}

function startPolling() {
  if (pollingInterval) clearInterval(pollingInterval);
  pollingInterval = setInterval(() => {
    if (document.visibilityState === 'visible') {
      dbLoad().then(() => {
        if (state.tab === 'orders' || state.tab === 'home') render();
      }).catch(function (e) { console.warn('Sync:', e.message); });

  }, 30000);
}

async function openProofModal(ref) {
  if (!ref) return;
  const modal = document.getElementById("modal");
  modal.innerHTML = `
    <div class="modal-box" style="max-width: 500px; background: #000;">
      <div class="modal-head" style="background: #fff; border-bottom: 1px solid #ddd;"><h2>Comprobante de Pago</h2><button class="modal-close" onclick="closeModal()">✕</button></div>
      <div class="modal-body" style="text-align:center; padding: 40px; color:#fff;">
        <div id="proofLoading">Cargando comprobante…</div>
        <img id="proofImage" alt="Comprobante" style="display:none; max-width: 100%; max-height: 75vh; margin: 0 auto;">
      </div>
      <div class="modal-foot" style="background: #fff;"><button class="btn btn-primary" onclick="closeModal()">Cerrar</button></div>
    </div>`;
  modal.classList.remove("hidden");

  try {
    // Nuevos: se guarda la ruta. Antiguos: URL pública; se extrae la ruta y se firma.
    let path = ref;
    if (/^https?:\/\//i.test(ref)) {
      const marker = '/comprobantes/';
      const i = ref.indexOf(marker);
      if (i === -1) { window.open(ref, '_blank', 'noopener'); closeModal(); return; }
      path = decodeURIComponent(ref.slice(i + marker.length).split('?')[0]);
    }
    const { data, error } = await supabaseClient.storage.from('comprobantes').createSignedUrl(path, 3600);
    if (error || !data) throw error || new Error('sin URL firmada');
    const img = document.getElementById('proofImage');
    const loading = document.getElementById('proofLoading');
    if (!img) return;
    if (loading) loading.style.display = 'none';
    img.src = data.signedUrl;
    img.style.display = 'block';
  } catch (e) {
    const loading = document.getElementById('proofLoading');
    if (loading) loading.textContent = 'No se pudo abrir el comprobante.';
  }
}

function parseCoordsInput(value) {
  const s = String(value || '').trim();
  if (!s) return null;
  let m = s.match(/!3d(-?\d+(?:\.\d+)?)!4d(-?\d+(?:\.\d+)?)/);
  if (m) return { lat: parseFloat(m[1]), lng: parseFloat(m[2]) };
  m = s.match(/@(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/);
  if (m) return { lat: parseFloat(m[1]), lng: parseFloat(m[2]) };
  m = s.match(/(-?\d+(?:\.\d+)?)\s*[,;]\s*(-?\d+(?:\.\d+)?)/);
  if (m) return { lat: parseFloat(m[1]), lng: parseFloat(m[2]) };
  return null;
}

function renderDeliveryConfigEditor() {
  const cfg = DB.config.delivery_config || {};
  const storeEl = document.getElementById('dStoreCoords');
  const thEl = document.getElementById('dThreshold');
  const urEl = document.getElementById('dUrbanFee');
  const exEl = document.getElementById('dExtraFee');
  if (!storeEl || !thEl || !urEl || !exEl) return;

  storeEl.value = (cfg.store_lat != null && cfg.store_lng != null) ? `${cfg.store_lat}, ${cfg.store_lng}` : '';
  thEl.value = cfg.threshold_km != null ? cfg.threshold_km : 4;

  const legacyZones = Array.isArray(cfg.zones) ? cfg.zones : [];
  const urban = cfg.urban_fee != null ? cfg.urban_fee : (legacyZones[1] ? legacyZones[1].fee : DB.config.deliveryFee);
  const extra = cfg.extra_fee != null ? cfg.extra_fee : (legacyZones[2] ? legacyZones[2].fee : DB.config.deliveryFee);
  urEl.value = Number(urban || 0).toFixed(2);
  exEl.value = Number(extra || 0).toFixed(2);

  const preview = document.getElementById('deliveryPreview');
  if (preview) {
    preview.innerHTML = `Hasta <b>${Number(thEl.value) || 4} km</b>: ${money(urban || 0)} · Más lejos: ${money(extra || 0)}<br>` +
      (storeEl.value ? `Ubicación: ${esc(storeEl.value)}` : '⚠️ Falta la ubicación de la tienda: el cliente verá la tarifa base.');
  }
}

async function saveDeliveryConfig() {
  const coords = parseCoordsInput(document.getElementById('dStoreCoords').value);
  if (!coords) return toast('Pega una ubicación válida (lat, lng o enlace de Google Maps)', 'error');
  if (coords.lat < -90 || coords.lat > 90 || coords.lng < -180 || coords.lng > 180) {
    return toast('Coordenadas fuera de rango', 'error');
  }

  const threshold = parseFloat(document.getElementById('dThreshold').value);
  const urban = parseFloat(document.getElementById('dUrbanFee').value);
  const extra = parseFloat(document.getElementById('dExtraFee').value);
  if (!isFinite(threshold) || threshold <= 0) return toast('Distancia límite inválida', 'error');
  if (!isFinite(urban) || urban < 0) return toast('Tarifa Urbana inválida', 'error');
  if (!isFinite(extra) || extra < 0) return toast('Tarifa Extra Urbana inválida', 'error');

  DB.config.delivery_config = {
    store_lat: coords.lat,
    store_lng: coords.lng,
    threshold_km: threshold,
    urban_fee: urban,
    extra_fee: extra
  };

  try {
    await dbSaveConfig();
    toast('✅ Delivery guardado');
    renderDeliveryConfigEditor();
  } catch (e) {
    console.error(e);
    toast('Error al guardar el delivery', 'error');
  }
}

async function uploadLogo(e) {
  const file = e.target.files[0]; if (!file) return;
  if (file.size > 2 * 1024 * 1024) return toast("La imagen es muy grande (máx 2MB)", "error");
  
  const btn = document.getElementById("bLogoFile");
  btn.disabled = true;

  const fileExt = file.name.split('.').pop();
  const fileName = `logo-${Date.now()}.${fileExt}`;
  
  const { error } = await supabaseClient.storage.from('productos').upload(fileName, file);
  
  if (error) {
    toast("Error al subir logo", "error");
    btn.disabled = false;
    return;
  }
  
  const { data } = supabaseClient.storage.from('productos').getPublicUrl(fileName);
  
  document.getElementById("bLogoUrl").value = data.publicUrl;
  document.getElementById("logoPreview").innerHTML = `<img src="${data.publicUrl}" style="width:100%;height:100%;object-fit:cover;">`;
  document.getElementById("sbLogo").innerHTML = `<img src="${data.publicUrl}">`;
  
  await supabaseClient.from('config').update({ logo: data.publicUrl }).eq('id', 1);
  
  let cached = JSON.parse(localStorage.getItem('ff_config_cache') || '{}');
  cached.logo = data.publicUrl;
  localStorage.setItem('ff_config_cache', JSON.stringify(cached));
  
  DB.config.logo = data.publicUrl;

  toast("✅ Logo actualizado en toda la app");
  btn.disabled = false;
}

async function savePayment() {
  const type = document.getElementById("pay-type").value;
  const label = document.getElementById("pay-label").value.trim();
  const icon = document.getElementById("pay-icon").value.trim() || '💳';
  const details = {};
  
  if (type === 'pagomovil') {
    details.banco = document.getElementById("pd-banco").value.trim();
    details.telefono = document.getElementById("pd-telefono").value.trim();
    details.cedula = document.getElementById("pd-cedula").value.trim();
  } else if (type === 'transferencia') {
    details.banco = document.getElementById("pd-banco").value.trim();
    details.titular = document.getElementById("pd-titular").value.trim();
    details.cuenta = document.getElementById("pd-cuenta").value.trim();
    details.rif = document.getElementById("pd-rif").value.trim();
  } else if (type === 'zelle') {
    details.email = document.getElementById("pd-email").value.trim();
    details.titular = document.getElementById("pd-titular").value.trim();
  }

  if (!label) return toast("Ponle una etiqueta al método", "error");
  const newPayment = { id: type + '_' + Date.now(), type, label, icon, details };

  if (editingPaymentIndex !== null) DB.config.payments[editingPaymentIndex] = newPayment;
  else { if (!DB.config.payments) DB.config.payments = []; DB.config.payments.push(newPayment); }

  await dbSaveConfig();
  toast("✅ Método guardado");
  closeModal();
  render();
}

  editingProductId = id;
  const isEdit = !!id;
  const product = isEdit ? DB.menu.find(p => p.id === id) : { name: "", desc: "", price: "", cat: "", emoji: "🍔", badge: "", img: null, extras: [] };
  tempImgFile = null;
  const catsOptions = DB.cats.map(c => `<option value="${c.id}" ${product.cat === c.id ? 'selected' : ''}>${esc(c.name)}</option>`).join("");

  document.getElementById("modal").innerHTML = `
    <div class="modal-box">
      <div class="modal-head"><h2>${isEdit ? 'Editar' : 'Nuevo'} Producto</h2><button class="modal-close" onclick="closeModal()">✕</button></div>
      <div class="modal-body">
        <div class="form-grid">
          <div class="field full"><label>Nombre *</label><input type="text" id="p-name" value="${esc(product.name)}"></div>
          <div class="field full"><label>Descripción</label><textarea id="p-desc">${esc(product.desc)}</textarea></div>
          <div class="field"><label>Precio ($) *</label><input type="number" id="p-price" step="0.01" min="0" value="${product.price}"></div>
          <div class="field"><label>Categoría *</label><select id="p-cat"><option value="">Selecciona...</option>${catsOptions}</select></div>
          
          <div class="field">
            <label>Icono</label>
            <input type="hidden" id="p-emoji" value="${esc(product.emoji || '🍔')}">
            <div id="p-emoji-preview" class="emoji-input-box" onclick="openEmojiPicker('p-emoji-preview')">
              ${esc(product.emoji || '🍔')}
            </div>
          </div>
          
          <div class="field"><label>Etiqueta (Badge)</label><input type="text" id="p-badge" value="${esc(product.badge || '')}"></div>
          
          <div class="field full"><label>Imagen (opcional)</label>
            <div class="img-picker" style="height: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px;">
              <input type="file" id="p-img-file" accept="image/*" style="display:none" onchange="handleImgUpload(event)">
              <input type="file" id="p-img-camera" accept="image/*" capture="environment" style="display:none" onchange="handleImgUpload(event)">
              
              <div id="p-img-preview" style="width: 100%; height: 180px; border-radius: 12px; overflow: hidden; background: var(--surface-2); display: flex; align-items: center; justify-content: center;">
                ${product.img ? `<img src="${esc(product.img)}" style="width:100%; height:100%; object-fit:cover;">` : '<div class="placeholder" style="color:var(--muted);">📷 Sin imagen</div>'}
              </div>

              <div style="display: flex; gap: 10px; width: 100%;">
                <button type="button" class="btn btn-ghost" style="flex: 1; padding: 10px; border-radius: 10px;" onclick="document.getElementById('p-img-camera').click()">
                  📸 Tomar Foto
                </button>
                <button type="button" class="btn btn-ghost" style="flex: 1; padding: 10px; border-radius: 10px;" onclick="document.getElementById('p-img-file').click()">
                  🖼️ Galería
                </button>
              </div>
            </div>
          </div>
          
          <div class="field full"><label>Extras</label><div id="p-extras-list"></div><button class="btn btn-ghost btn-sm" onclick="addExtraRow()" style="margin-top:8px">＋ Añadir extra</button></div>
        </div>
      </div>
      <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="saveProduct()">Guardar producto</button></div>
    </div>`;
  document.getElementById("modal").classList.remove("hidden");
  if (product.extras && product.extras.length) product.extras.forEach(e => addExtraRow(e.name, e.price)); else addExtraRow();
}

function handleImgUpload(e) {
  const file = e.target.files[0]; if (!file) return;
  if (file.size > 10 * 1024 * 1024) { toast("La imagen es muy grande (máx 10MB)", "error"); return; }
  
  const reader = new FileReader();
  reader.onload = (ev) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      const MAX_WIDTH = 800;
      const scaleSize = MAX_WIDTH / img.width;
      canvas.width = MAX_WIDTH;
      canvas.height = img.height * scaleSize;
      
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      
      canvas.toBlob((blob) => {
        const compressedFile = new File([blob], file.name.replace(/\.[^/.]+$/, "") + ".jpg", {
          type: "image/jpeg",
          lastModified: Date.now()
        });
        tempImgFile = compressedFile;
        document.getElementById("p-img-preview").innerHTML = `<img src="${canvas.toDataURL('image/jpeg', 0.7)}" style="width:100%; height:100%; object-fit:cover;">`;
      }, 'image/jpeg', 0.7);
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

function addExtraRow(name = "", price = "") {
  const container = document.getElementById("p-extras-list"); if (!container) return;
  const row = document.createElement("div"); row.className = "extra-row";
  row.innerHTML = `<input type="text" class="ex-name" value="${esc(name)}" placeholder="Ej: Queso"><input type="number" class="ex-price" value="${price}" step="0.01" min="0" placeholder="Precio"><button onclick="this.parentElement.remove()">✕</button>`;
  container.appendChild(row);
}

async function saveProduct() {
  const name = document.getElementById("p-name").value.trim();
  const desc = document.getElementById("p-desc").value.trim();
  const price = parseFloat(document.getElementById("p-price").value);
  const cat = document.getElementById("p-cat").value;
  const emoji = document.getElementById("p-emoji").value.trim() || "🍔";
  const badge = document.getElementById("p-badge").value.trim() || null;
  
  if (!name || !price || isNaN(price) || price <= 0 || !cat) return toast("Completa los campos obligatorios (*)", "error");

  const btn = document.querySelector(".modal-foot .btn-primary"); 
  btn.disabled = true; btn.textContent = "Guardando...";

  try {
    let finalImgUrl = null;
    let existingImg = null;

    if (editingProductId) {
      const existing = DB.menu.find(p => p.id === editingProductId);
      existingImg = existing.img;
    }

    if (tempImgFile) {
      const fileExt = tempImgFile.name.split('.').pop();
      const fileName = `${Date.now()}-${Math.random().toString(36).substring(2)}.${fileExt}`;
      
      const { data: uploadData, error: uploadError } = await supabaseClient.storage
        .from('productos')
        .upload(fileName, tempImgFile, { cacheControl: '3600', upsert: false });

      if (uploadError) throw uploadError;

      const { data: urlData } = supabaseClient.storage
        .from('productos')
        .getPublicUrl(fileName);
      
      finalImgUrl = urlData.publicUrl;
    }

    const extras = [];
    document.querySelectorAll("#p-extras-list .extra-row").forEach(row => {
      const exName = row.querySelector(".ex-name").value.trim();
      const exPrice = parseFloat(row.querySelector(".ex-price").value);
      if (exName && !isNaN(exPrice) && exPrice > 0) extras.push({ name: exName, price: exPrice });
    });

    let avail = true;
    if (editingProductId) {
      const existing = DB.menu.find(p => p.id === editingProductId);
      avail = existing.available !== false;
    }

    const productData = { 
      name, desc, price, cat, emoji, badge, 
      img: finalImgUrl || existingImg,
      extras, available: avail 
    };

    if (editingProductId) { 
      const idx = DB.menu.findIndex(p => p.id === editingProductId); 
      if (idx > -1) DB.menu[idx] = { ...DB.menu[idx], ...productData }; 
    } else { 
      DB.menu.push({ id: 'temp-' + Date.now(), ...productData }); 
    }

    await dbSaveMenu(); 
    toast("✅ Producto guardado"); 
    tempImgFile = null;
    closeModal(); 
    render(); 

  } catch(err) { 
    console.error("Error al guardar:", err);
    toast("❌ Error al subir la imagen o guardar el producto", "error"); 
    btn.disabled = false; btn.textContent = "Guardar producto"; 
  }
}

    return;
  }
  
  m.innerHTML = `
    <div class="page-head">
      <div><h1 class="page-title">Categorías</h1></div>
      <button class="btn btn-primary" onclick="openCategoryEditor()">＋ Nueva categoría</button>
    </div>
    <div class="cat-list">
      ${DB.cats.map(c=>`
        <div class="cat-row">
          <div class="cat-icon" style="overflow:hidden; display:flex; align-items:center; justify-content:center;">
            ${c.icon && String(c.icon).startsWith('http') ? `<img src="${esc(c.icon)}" style="width:100%; height:100%; object-fit:cover;">` : esc(c.icon || '📁')}

}

let editingCategoryId = null;

function openCategoryEditor() {
  document.getElementById("modal").innerHTML = `
    <div class="modal-box">
      <div class="modal-head"><h2>Nueva Categoría</h2><button class="modal-close" onclick="closeModal()">✕</button></div>
      <div class="modal-body">
        <div class="field">
          <label>Nombre de la categoría *</label>
          <input type="text" id="cat-name" placeholder="Ej: Hamburguesas">
        </div>
        <div class="field">
          <label>Icono (Emoji)</label>
          <input type="hidden" id="cat-emoji" value="🍔">
          <div id="cat-emoji-preview" class="emoji-input-box" onclick="openEmojiPicker('cat-emoji-preview')">
            🍔
          </div>
        </div>
        <div class="field" style="border-top:1px dashed var(--line); padding-top:16px; margin-top:16px;">
          <label>O pega la URL de una imagen (Opcional)</label>
          <input type="text" id="cat-img-url" placeholder="https://..." oninput="if(this.value){document.getElementById('cat-emoji-preview').innerHTML='<img src=\''+this.value+'\' style=\'width:100%;height:100%;object-fit:contain;\'>'; document.getElementById('cat-emoji').value=this.value;}">
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
        <button class="btn btn-primary" onclick="saveCategory()">Guardar Categoría</button>
      </div>

}

async function saveCategory() {
  const name = document.getElementById("cat-name").value.trim();
  const icon = document.getElementById("cat-emoji").value.trim() || "📁";
  
  if (!name) return toast("Escribe el nombre de la categoría", "error");

  const btn = document.querySelector(".modal-foot .btn-primary"); 
  btn.disabled = true; btn.textContent = "Guardando...";

  const { data, error } = await supabaseClient.from('categories').insert([{ name, icon }]).select();
  
  btn.disabled = false; 
  btn.textContent = "Guardar Categoría";

  if (error) {
    console.error("Error exacto de Supabase:", error);
    toast("Error: " + error.message, "error");
    return;
  }

  dbLoad().then(() => { 
    closeModal();
    render(); 
    toast("✅ Categoría creada"); 
  }).catch(function (e) { toast("Creada, pero no se pudo recargar: " + e.message, "error"); });
}

async function deleteCategory(id) {
  if (!confirm("¿Eliminar esta categoría?")) return;
  await supabaseClient.from('categories').delete().eq('id', id);
  dbLoad().then(() => { render(); toast("Categoría eliminada"); }).catch(function (e) { toast("Eliminada, pero no se pudo recargar: " + e.message, "error"); });
}

  DB.drivers = drivers || [];
  
  if (error) {
    m.innerHTML = `<div class="page-head"><h1 class="page-title">Repartidores</h1></div>` + getErrorHTML("No se pudo cargar la lista de repartidores.", "renderDrivers");
    return;
  }
  
  if (!drivers || drivers.length === 0) {
    m.innerHTML = `<div class="page-head"><div><h1 class="page-title">Repartidores</h1></div><button class="btn btn-primary" onclick="openDriverEditor()">＋ Nuevo Repartidor</button></div>` + 
                  getEmptyHTML("Sin repartidores", "Agrega a tu equipo de entregas para que reciban pedidos.", "🛵", `<button class="btn btn-primary" style="width:auto; padding:12px 24px;" onclick="openDriverEditor()">Agregar Repartidor</button>`);
    return;
  }
  
  m.innerHTML = `
    <div class="page-head">
      <div><h1 class="page-title">Repartidores</h1></div>
      <button class="btn btn-primary" onclick="openDriverEditor()">＋ Nuevo Repartidor</button>
    </div>
    <div class="p-list">
      ${drivers.map(d => `
        <div class="p-card ${d.active ? '' : 'unavailable'}" style="align-items: center;">
          <div class="p-thumb" style="background:${d.active ? 'var(--brand-soft)' : 'var(--line)'}; font-size:24px; color:${d.active ? 'var(--brand)' : 'var(--muted)'}">
            ${d.active ? '🛵' : '🚫'}
          </div>
          <div class="p-info">
            <h4>${esc(d.name)}</h4>
            <p>Email: ${esc(d.email)}</p>
          </div>
          <div class="p-actions">
            <button class="btn-toggle-avail ${d.active ? 'avail' : 'unavail'}" onclick="toggleDriverStatus('${d.id}', ${d.active})" title="Habilitar/Inhabilitar">
              ${d.active ? '✅' : '🚫'}
            </button>
            <button onclick="openDriverEditorById('${d.id}')" title="Editar">✎</button>
            <button onclick="deleteDriver('${d.id}')" style="color:var(--danger)" title="Eliminar">✕</button>
          </div>

      `).join('')}

}

function openDriverEditorById(id) {
  const d = (DB.drivers || []).find(x => x.id === id);
  if (!d) return toast("Repartidor no encontrado", "error");
  openDriverEditor(d.id, d.name, d.email);
}

function openDriverEditor(id = null, name = '', email = '') {
  const isEdit = !!id;
  document.getElementById("modal").innerHTML = `
    <div class="modal-box">
      <div class="modal-head"><h2>${isEdit ? 'Editar' : 'Nuevo'} Repartidor</h2><button class="modal-close" onclick="closeModal()">✕</button></div>
      <div class="modal-body">
        <div class="field"><label>Nombre Completo *</label><input type="text" id="d-name" value="${esc(name)}" placeholder="Ej: Carlos Pérez"></div>
        <div class="field"><label>Correo (Para login) *</label><input type="email" id="d-email" value="${esc(email)}" placeholder="ejemplo@correo.com"></div>
        <div class="field"><label>Contraseña *</label><input type="text" id="d-pass" placeholder="${isEdit ? 'Dejar en blanco para no cambiar' : 'Ej: 123456'}"><div style="font-size:11.5px; color:var(--muted); margin-top:6px; line-height:1.5;">⚠️ Usa una contraseña única para el repartidor (no la del correo) y cámbiala si se filtra.</div></div>
        <input type="hidden" id="d-id" value="${id || ''}">
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
        <button class="btn btn-primary" onclick="saveDriver()">Guardar</button>
      </div>
    </div>`;
  document.getElementById("modal").classList.remove("hidden");
}

async function saveDriver() {
  const id = document.getElementById("d-id").value;
  const name = document.getElementById("d-name").value.trim();
  const email = document.getElementById("d-email").value.trim();
  const password = document.getElementById("d-pass").value.trim();

  if (!name || !email) return toast("Nombre y correo son obligatorios", "error");
  if (!id && !password) return toast("La contraseña es obligatoria para nuevos repartidores", "error");

  const btn = document.querySelector(".modal-foot .btn-primary");
  btn.disabled = true; btn.textContent = "Guardando...";

  const driverData = { name, email };
  if (password) driverData.password = password;

  let error;

  if (id) {
    const res = await supabaseClient.from('drivers').update(driverData).eq('id', id);
    error = res.error;
  } else {
    const res = await supabaseClient.from('drivers').insert([driverData]);
    error = res.error;
  }

  btn.disabled = false; btn.textContent = "Guardar";

  if (error) {
    toast("Error: " + error.message, "error");
  } else {
    toast("✅ Repartidor guardado");
    closeModal();
    render(); 
  }
}

async function toggleDriverStatus(id, currentStatus) {
  await supabaseClient.from('drivers').update({ active: !currentStatus }).eq('id', id);
  render();
}

async function deleteDriver(id) {
  if (!confirm("¿Eliminar este repartidor?")) return;
  await supabaseClient.from('drivers').delete().eq('id', id);
  render();
  toast("Repartidor eliminado");
}

function renderReports(m) {
  const hoy = new Date();
  // Fechas en hora local: toISOString() usa UTC y en Venezuela (UTC-4) movía el día/mes.
  const localISO = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const primerDia = localISO(new Date(hoy.getFullYear(), hoy.getMonth(), 1));
  const ultimoDia = localISO(hoy);
  m.innerHTML = `
    <div class="page-head"><div><h1 class="page-title">Reportes</h1></div></div>
    <div class="card" style="margin-bottom:24px"><div class="card-body">
      <div class="report-filters">
        <div class="field"><label>Desde</label><input type="date" id="rep-start" value="${primerDia}"></div>
        <div class="field"><label>Hasta</label><input type="date" id="rep-end" value="${ultimoDia}"></div>
        <button class="btn btn-primary" onclick="generarReporte()">Generar Reporte</button>
      </div>
      <div class="report-actions" id="rep-actions" style="display:none"><button class="btn btn-ghost" onclick="exportarCSV()">📊 Excel/CSV</button><button class="btn btn-ghost" onclick="window.print()">📄 PDF</button></div>
    </div></div>
    <div id="report-content"></div>`;
}

function generarReporte() {
  const start = new Date(document.getElementById("rep-start").value + "T00:00:00");
  const end = new Date(document.getElementById("rep-end").value + "T23:59:59");
  if (isNaN(start) || isNaN(end) || start > end) return toast("Rango inválido", "error");
  const filtered = DB.orders.filter(o => { const d = new Date(o.created_at || o.createdAt); return d >= start && d <= end; });
  let totalIngresos = 0; let clientesSet = new Set(); let productosVendidos = {};
  filtered.forEach(o => {
    totalIngresos += Number(o.total);
    if (o.customer && o.customer.phone) clientesSet.add(o.customer.phone);
    if (o.items) o.items.forEach(it => {
      if (!productosVendidos[it.name]) productosVendidos[it.name] = { qty: 0, total: 0 };
      productosVendidos[it.name].qty += it.qty; productosVendidos[it.name].total += (it.unit * it.qty);
    });
  });
  document.getElementById("rep-actions").style.display = "flex";
  document.getElementById("report-content").innerHTML = `
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-icon" style="background:var(--ok-soft);color:var(--ok)">💰</div><div class="stat-info"><p>Ingresos</p><h3>${money(totalIngresos)}</h3></div></div>
      <div class="stat-card"><div class="stat-icon" style="background:#E0F2FE;color:#0284C7">🧾</div><div class="stat-info"><p>Pedidos</p><h3>${filtered.length}</h3></div></div>
      <div class="stat-card"><div class="stat-icon" style="background:var(--brand-soft);color:var(--brand)">👥</div><div class="stat-info"><p>Clientes</p><h3>${clientesSet.size}</h3></div></div>
    </div>
    <div class="card"><div class="card-body"><table class="report-table"><thead><tr><th>Producto</th><th>Cantidad</th><th>Ingresos</th></tr></thead><tbody>
      ${Object.keys(productosVendidos).sort((a,b)=>productosVendidos[b].qty - productosVendidos[a].qty).map(name => `<tr><td><b>${esc(name)}</b></td><td>${productosVendidos[name].qty} u.</td><td>${money(productosVendidos[name].total)}</td></tr>`).join("")}
    </tbody></table></div></div>`;
  window.currentReportData = filtered;
}

function exportarCSV() {
  if (!window.currentReportData || window.currentReportData.length === 0) return toast("No hay datos", "error");
  let csv = "Codigo,Fecha,Cliente,Telefono,Metodo de Pago,Total\n";
  window.currentReportData.forEach(o => { csv += `"${o.code}","${new Date(o.created_at||o.createdAt).toLocaleString()}","${o.customer.name}","${o.customer.phone}","${o.payment_method||o.payment}",${o.total}\n`; });
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement("a"); link.href = URL.createObjectURL(blob); link.download = `Reporte_${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(link); link.click(); document.body.removeChild(link); toast("✅ CSV descargado");
}

document.addEventListener("DOMContentLoaded", function() {
  document.addEventListener('pointerdown', function () { getAudioCtx(); }, { once: true });
  if (!supabaseClient) return;
  checkAuth();
  document.getElementById("loginPass").addEventListener("keydown", function(e) { if (e.key === "Enter") doLogin(); });
  supabaseClient.auth.onAuthStateChange((event) => { if (event === 'SIGNED_IN' || event === 'INITIAL_SESSION' || event === 'SIGNED_OUT') checkAuth(); });
});
