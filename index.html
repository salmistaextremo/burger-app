<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Rapid Burger — Pide y rastrea en tiempo real</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#FFFFFF; --bg-2:#F8F9FA; --surface:#FFFFFF; --surface-2:#F5F6F8;
  --line:#E8EAED; --line-2:#DDE1E6;
  --ink:#1A1D21; --ink-2:#4A5058; --muted:#8A9099; --muted-2:#B8BEC5;
  --brand:#FF6B2C; --brand-2:#FF8A4C; --brand-d:#E85A1F; --brand-soft:#FFF2EC; --brand-glow:rgba(255,107,44,0.28);
  --ok:#22C55E; --ok-soft:#E8F9EE; --danger:#EF4444; --danger-soft:#FEF2F2; --wa:#25D366;
  --star:#FFC107;
  --r:16px; --r-lg:24px; --r-sm:12px;
  --shadow-sm:0 1px 2px rgba(0,0,0,0.04);
  --shadow:0 4px 16px rgba(0,0,0,0.06);
  --shadow-md:0 8px 28px rgba(0,0,0,0.08);
  --shadow-lg:0 16px 40px rgba(0,0,0,0.1);
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
html,body{margin:0;padding:0;background:#FFFFFF;height:100%;overflow:hidden}
body{font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased;background:#FFFFFF;font-weight:400;display:flex;flex-direction:column}
#app{max-width:520px;margin:0 auto;width:100%;height:100vh;background:var(--bg);position:relative;display:flex;flex-direction:column;box-shadow:0 0 80px rgba(0,0,0,0.04);overflow:hidden}
.hidden{display:none !important}

/* ====== PANTALLA DE BIENVENIDA Y CIERRE ====== */
.welcome-screen{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center;animation:fade .4s}
@keyframes floatHamburger {
  0% { transform: translateY(0px) rotate(0deg); }
  50% { transform: translateY(-12px) rotate(4deg); }
  100% { transform: translateY(0px) rotate(0deg); }
}
.welcome-avatar{width:120px;height:120px;border-radius:50%;background:linear-gradient(135deg, var(--brand-2), var(--brand));display:grid;place-items:center;font-size:60px;margin-bottom:24px;box-shadow:0 16px 40px var(--brand-glow);animation:floatHamburger 3s ease-in-out infinite}
.welcome-title{font-size:28px;font-weight:800;letter-spacing:-.8px;margin:0 0 12px;color:var(--ink);line-height:1.2}
.welcome-sub{font-size:15px;color:var(--muted);line-height:1.6;margin:0 0 32px;max-width:320px}
.input-wrap{width:100%;max-width:320px}
.name-input{width:100%;padding:18px;border-radius:16px;border:1px solid var(--line);background:var(--surface-2);font-size:16px;font-family:inherit;outline:none;color:var(--ink);text-align:center;font-weight:600;transition:.2s}
.name-input::placeholder{color:var(--muted-2);font-weight:400}
.name-input:focus{border-color:var(--brand);background:var(--surface);box-shadow:0 0 0 4px var(--brand-soft)}
.btn-start{width:100%;margin-top:14px;padding:18px;border-radius:16px;border:none;background:linear-gradient(135deg, var(--brand-2), var(--brand));color:#FFFFFF;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 8px 24px var(--brand-glow);transition:.2s}
.btn-start:active{transform:scale(.98)}
.btn-start:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}

/* ====== HEADER ====== */
.mini-hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:1px solid var(--line);background:rgba(255,255,255,0.92);backdrop-filter:blur(16px);z-index:10}
.mini-brand{display:flex;align-items:center;gap:10px}
.mini-logo{width:40px;height:40px;border-radius:12px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-size:20px;overflow:hidden;position:relative}
.mini-logo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mini-brand h1{margin:0;font-size:16px;font-weight:700;letter-spacing:-.3px}
.mini-brand p{margin:2px 0 0;font-size:11px;color:var(--muted);font-weight:500}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:18px;display:grid;place-items:center;cursor:pointer;transition:.2s}
.icon-btn:active{transform:scale(.94);background:var(--surface-2)}
.btn-back{width:auto;padding:0 12px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;}
.cart-btn{position:relative}
.cart-badge{position:absolute;top:-4px;right:-4px;background:var(--brand);color:#fff;font-size:10px;font-weight:800;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;border:2px solid #fff}

/* ====== CHAT UI ====== */
.chat-container{flex:1;overflow-y:auto;padding:20px 18px;display:flex;flex-direction:column;gap:16px;scroll-behavior:smooth;padding-bottom:100px}
.chat-msg{display:flex;gap:12px;max-width:90%;animation:slideUp .3s ease}
.chat-msg.bot{align-self:flex-start}
.chat-msg.user{align-self:flex-end;flex-direction:row-reverse}
@keyframes slideUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.msg-avatar{width:36px;height:36px;border-radius:50%;background:var(--brand-soft);display:grid;place-items:center;font-size:18px;flex:none;box-shadow:var(--shadow-sm);border:1px solid var(--brand-soft)}
.msg-bubble{background:var(--surface-2);padding:14px 18px;border-radius:18px 18px 18px 4px;font-size:14px;color:var(--ink);line-height:1.5;box-shadow:var(--shadow-sm);border:1px solid var(--line)}
.chat-msg.user .msg-bubble{background:var(--brand);color:#fff;border:none;border-radius:18px 18px 4px 18px;box-shadow:0 4px 12px var(--brand-glow)}

/* ====== OPCIONES Y PRODUCTOS ====== */
.options-container{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px;animation:fade .4s}
.opt-cat{flex:1 1 calc(50% - 12px);background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:.2s;box-shadow:var(--shadow-sm)}
.opt-cat:active{transform:scale(.96);border-color:var(--brand)}
.opt-cat .emoji{font-size:36px}
.opt-cat .name{font-size:14px;font-weight:600;color:var(--ink);text-align:center}

.prod-opt{flex:1 1 100%;background:#fff;border:1px solid var(--line);border-radius:20px;display:flex;flex-direction:column;overflow:hidden;cursor:pointer;transition:.2s;box-shadow:var(--shadow-sm);position:relative;margin-bottom:12px;}
.prod-opt:active{transform:scale(.98);border-color:var(--brand)}
.p-img-banner{width:100%;height:220px;background:var(--surface-2);display:grid;place-items:center;position:relative;overflow:hidden}
.p-img-banner img{width:100%;height:100%;object-fit:cover}
.p-img-banner span{font-size:80px}
.p-details{padding:18px;display:flex;flex-direction:column;gap:8px}
.p-info{flex:1;min-width:0}
.p-name{font-size:18px;font-weight:800;color:var(--ink);margin-bottom:4px;line-height:1.2}
.p-desc{font-size:13px;color:var(--muted);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.p-price-row{display:flex;align-items:center;justify-content:space-between;margin-top:8px;}
.p-price{font-size:22px;font-weight:900;color:var(--brand);display:flex;flex-direction:column;line-height:1.1;}
.price-ves{font-size:12px;color:var(--muted);font-weight:600;margin-top:4px; display: block; text-align: right;}
.p-add{width:44px;height:44px;border-radius:14px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-size:24px;font-weight:bold;flex:none;transition:0.2s}

.action-btn{width:100%;padding:16px;border-radius:14px;border:none;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:.2s;margin-top:6px;display:flex;align-items:center;justify-content:center;gap:8px}
.action-btn.primary{background:linear-gradient(135deg, var(--brand-2), var(--brand));color:#fff;box-shadow:0 4px 14px var(--brand-glow)}
.action-btn.secondary{background:var(--surface-2);color:var(--ink);border:1px solid var(--line); margin-top: 12px;}

/* ====== VISTAS (CARRITO/CHECKOUT/TRACKING) ====== */
.view-overlay{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;animation:up .3s ease}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.view-hdr{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);background:#fff}
.view-hdr .back-btn{background:none;border:none;font-size:22px;cursor:pointer;color:var(--ink);padding:8px;font-weight:800; display: flex; align-items: center; gap: 6px; font-size: 14px;}
.view-hdr h2{margin:0;font-size:18px;font-weight:800;flex:1;text-align:center;margin-right:32px}
.view-body{flex:1;overflow-y:auto;padding:20px;padding-bottom:100px}

/* ====== VISTA DE SEGUIMIENTO ====== */
#viewTracking .view-body { display: flex; flex-direction: column; justify-content: center; align-items: center; background: var(--surface-2); padding: 20px; }
.track-card { background: #fff; border-radius: 24px; padding: 28px 24px; box-shadow: var(--shadow-md); width: 100%; text-align: center; border: 1px solid var(--line); }
.track-card .tc-code { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--brand); font-weight: 800; }
.track-card .tc-num { font-size: 36px; font-weight: 900; color: var(--ink); margin: 4px 0 8px; letter-spacing: -1px; }
.track-card .tc-status { display: inline-flex; align-items: center; gap: 8px; background: var(--brand-soft); padding: 8px 16px; border-radius: 999px; font-size: 13px; font-weight: 700; color: var(--brand); margin-bottom: 24px; border: 1px solid #FFE0D0; }
.track-card .bar { height: 8px; background: var(--surface-2); border-radius: 99px; margin-bottom: 24px; overflow: hidden; border: 1px solid var(--line); }
.track-card .bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--brand-2), var(--brand)); border-radius: 99px; transition: width 0.5s ease; }
.track-card .steps { display: flex; flex-direction: column; gap: 16px; text-align: left; }
.track-card .step { display: flex; gap: 14px; opacity: 0.3; transition: all 0.4s; }
.track-card .step.done, .track-card .step.current { opacity: 1; }
.track-card .step .dot { width: 32px; height: 32px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; font-size: 16px; color: var(--muted); flex: none; border: 1px solid var(--line); transition: 0.4s; }
.track-card .step.done .dot { background: var(--ok); border-color: var(--ok); color: #fff; }
.track-card .step.current .dot { background: var(--brand); border-color: var(--brand); color: #fff; box-shadow: 0 0 0 4px var(--brand-soft); transform: scale(1.1); }
.track-card .step h5 { margin: 0 0 4px; font-size: 15px; font-weight: 700; color: var(--ink); }
.track-card .step p { margin: 0; font-size: 12.5px; color: var(--muted); line-height: 1.4; }

/* CARRITO Y CHECKOUT */
.cart-item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px;display:flex;gap:14px;align-items:flex-start}
.ci-emoji{width:70px;height:70px;border-radius:12px;display:grid;place-items:center;font-size:28px;background:var(--surface-2);flex:none;overflow:hidden;position:relative}
.ci-emoji img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ci-info{flex:1;min-width:0}
.ci-info h4{margin:0 0 4px;font-size:15px;font-weight:700}
.ci-info .extras{font-size:11.5px;color:var(--muted);line-height:1.5;margin:0}
.ci-right{display:flex;flex-direction:column;align-items:flex-end;gap:10px;flex:none}
.ci-price{font-size:16px;font-weight:800;color:var(--brand);display:flex;flex-direction:column;align-items:flex-end; text-align: right;}

.qty{display:flex;align-items:center;gap:6px;}
.qty button{width:28px;height:28px;border:none;background:transparent;border-radius:8px;font-size:20px;font-weight:500;cursor:pointer;color:var(--ink);display:grid;place-items:center;transition:.2s;}
.qty button:active{background:var(--surface-2);transform:scale(.9);}
.qty span{min-width:20px;text-align:center;font-size:15px;font-weight:800;}

.totals{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;margin-top:20px}
.trow{display:flex;justify-content:space-between;align-items:flex-start;font-size:13.5px;padding:7px 0;color:var(--muted)}
.trow.total{font-size:19px;font-weight:800;color:var(--ink);border-top:1px solid var(--line);margin-top:12px;padding-top:16px}
.trow b{color:var(--ink); font-weight: 600;}
.text-right { text-align: right; }

.btn-primary{width:100%;padding:16px;border-radius:14px;border:none;background:linear-gradient(135deg, var(--brand-2), var(--brand));color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 6px 20px var(--brand-glow);margin-top:16px}
.btn-wa{background:var(--wa);box-shadow:0 6px 20px rgba(37,211,102,0.28);margin-top:18px}

/* ====== BOTONERA INFERIOR ====== */
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;z-index:50;background:rgba(255,255,255,0.96);backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom))}
.nav-btn{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:9.5px;font-weight:600;color:var(--muted);cursor:pointer;padding:8px 0;position:relative;transition:.2s}
.nav-btn .ni{font-size:22px;line-height:1}
.nav-btn.active{color:var(--brand)}
.nav-badge{position:absolute;top:2px;right:50%;margin-right:-26px;background:var(--brand);color:#FFFFFF;font-size:9.5px;font-weight:800;min-width:18px;height:18px;border-radius:10px;display:grid;place-items:center;padding:0 5px;border:2px solid #fff}

/* MODAL Y UTILS */
.modal{position:fixed;inset:0;z-index:100;background:rgba(26,29,33,0.5);backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;animation:fade .25s}
.sheet{width:100%;max-width:520px;background:var(--surface);border-radius:28px 28px 0 0;max-height:92vh;overflow-y:auto;animation:up .35s cubic-bezier(.2,.9,.3,1);border:1px solid var(--line);border-bottom:none}
.sheet-hero{position:relative;width:100%;height:220px;background:var(--surface-2);display:grid;place-items:center;overflow:hidden;border-radius:28px 28px 0 0}
.sheet-hero-emoji{font-size:100px;opacity:.35;position:absolute}
.sheet-hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sheet-close{position:absolute;top:16px;right:16px;z-index:4;width:40px;height:40px;border-radius:50%;border:none;background:rgba(255,255,255,0.95);font-size:18px;cursor:pointer;box-shadow:var(--shadow-sm)}
.sheet-body{padding:22px}
.sheet-body h2{margin:0 0 4px;font-size:22px;font-weight:800}
.sheet-body .desc{font-size:13.5px;color:var(--muted);margin:0 0 20px;line-height:1.6}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:9px;cursor:pointer;font-size:13.5px;font-weight:500}
.opt:has(input:checked){border-color:var(--brand);background:var(--brand-soft)}
.opt input{display:none}
.opt .box{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;flex:none;font-size:13px;color:transparent;background:var(--surface-2)}
.opt:has(input:checked) .box{background:var(--brand);border-color:var(--brand);color:#fff}
.qty-row{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:20px 0}
.qty-row .qty button{width:44px;height:44px;font-size:22px; background:var(--surface-2); border-radius:12px;}
.qty-row .qty span{font-size:18px;min-width:40px}

.field{margin-bottom:18px}
.field label{display:block;font-size:12.5px;font-weight:600;margin-bottom:8px;color:var(--ink-2)}
.field input,.field textarea,.field select{width:100%;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-family:inherit;outline:none;transition:.2s}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
.field textarea{resize:vertical;min-height:80px}
.seg{display:flex;gap:10px}
.seg label{flex:1;border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center;cursor:pointer;font-size:13px;font-weight:500;background:var(--surface);color:var(--muted)}
.seg input{display:none}
.seg label:has(input:checked){border-color:var(--brand);background:var(--brand-soft);color:var(--brand);font-weight:600}

.proof-picker{position:relative;width:100%;min-height:110px;background:var(--surface-2);border:2px dashed var(--line-2);border-radius:14px;display:grid;place-items:center;cursor:pointer;padding:16px}
.proof-picker input{display:none}
.proof-preview{position:relative;width:100%;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#000}
.proof-preview img{width:100%;max-height:250px;object-fit:contain;display:block}
.proof-remove{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,0.6);color:#fff;border:none;font-size:14px}

.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);z-index:200;background:var(--ink);color:#fff;padding:14px 22px;border-radius:12px;font-size:13.5px;opacity:0;pointer-events:none;transition:.3s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-10px)}

/* ====== MODAL DE CALIFICACIÓN ====== */
.rating-modal { position: fixed; inset: 0; z-index: 200; background: rgba(26,29,33,0.6); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; padding: 20px; }
.rating-box { background: #fff; border-radius: 24px; padding: 32px 24px; text-align: center; box-shadow: var(--shadow-lg); width: 100%; max-width: 360px; animation: up 0.3s ease; }
.rating-box h2 { margin: 0 0 8px; font-size: 22px; font-weight: 800; }
.rating-box p { margin: 0 0 20px; font-size: 14px; color: var(--muted); }
.stars-container { display: flex; justify-content: center; gap: 10px; margin-bottom: 24px; }
.star { font-size: 40px; color: var(--line); cursor: pointer; transition: 0.2s; line-height: 1; }
.star.active { color: var(--star); text-shadow: 0 0 10px rgba(255,193,7,0.4); }
.star:hover { transform: scale(1.1); }
.rating-box textarea { width: 100%; padding: 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface-2); font-family: inherit; font-size: 14px; resize: none; margin-bottom: 20px; outline: none; transition: 0.2s; }
.rating-box textarea:focus { border-color: var(--brand); background: #fff; box-shadow: 0 0 0 4px var(--brand-soft); }
</style>
</head>
<body>

<!-- PANTALLA DE TIENDA CERRADA -->
<div id="closedScreen" class="welcome-screen hidden" style="background: var(--surface-2);">
  <div class="welcome-avatar" style="background: var(--surface); color: var(--muted); font-size: 50px; animation: none; box-shadow: none;">😴</div>
  <h1 class="welcome-title">Actualmente cerrado</h1>
  <p class="welcome-sub">Lo sentimos, en este momento no estamos recibiendo pedidos. Nuestro horario de atención es:</p>
  <div style="background: #fff; padding: 20px; border-radius: 16px; border: 1px solid var(--line); margin-bottom: 24px; width: 100%; max-width: 320px; text-align: center;">
    <div id="closedScheduleText" style="font-size: 14px; font-weight: 600; color: var(--ink); line-height: 1.6;"></div>
  </div>
  <button class="btn-start" style="background: var(--ink); box-shadow: none;" onclick="exitApp()">Cerrar Aplicación</button>
</div>

<!-- PANTALLA 1: BIENVENIDA -->
<div id="welcomeScreen" class="welcome-screen hidden">
  <div class="welcome-avatar" id="welcomeBot">🍔</div>
  <h1 class="welcome-title">¡Bienvenido a <span id="welcomeBrand">Rapid Burger</span>!</h1>
  <p class="welcome-sub">Soy tu asistente. Escribe tu nombre y te guiaré paso a paso para armar tu pedido perfecto.</p>
  <div class="input-wrap">
    <input id="nameInput" class="name-input" type="text" placeholder="Tu nombre aquí..." maxlength="30" autocomplete="off">
    <button id="startBtn" class="btn-start" disabled>Comenzar pedido →</button>
  </div>
</div>

<div id="app" class="hidden">
  <header class="mini-hdr">
    <div class="mini-brand">
      <div class="mini-logo" id="brandLogo">🍔</div>
      <div>
        <h1 id="brandName">Rapid Burger</h1>
        <p id="storeStatus">Abierto ahora</p>
      </div>
    </div>
    <button class="icon-btn btn-back" onclick="goBack()" title="Regresar">
      <span style="font-size:18px; line-height:1;">←</span> Regresar
    </button>
  </
