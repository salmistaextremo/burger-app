<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Rapid Burger — Pide y rastrea en tiempo real</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#FFFFFF; --bg-2:#F8F9FA; --surface:#FFFFFF; --surface-2:#F5F6F8;
  --line:#E8EAED; --line-2:#DDE1E6;
  --ink:#1A1D21; --ink-2:#4A5058; --muted:#8A9099; --muted-2:#B8BEC5;
  --brand:#FF6B2C; --brand-2:#FF8A4C; --brand-d:#E85A1F; --brand-soft:#FFF2EC; --brand-glow:rgba(255,107,44,0.28);
  --ok:#22C55E; --ok-soft:#E8F9EE; --danger:#EF4444; --danger-soft:#FEF2F2; --wa:#25D366;
  --r:16px; --r-lg:24px; --r-sm:12px;
  --shadow-sm:0 1px 2px rgba(0,0,0,0.04);
  --shadow:0 4px 16px rgba(0,0,0,0.06);
  --shadow-md:0 8px 28px rgba(0,0,0,0.08);
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
html,body{margin:0;padding:0;background:#FFFFFF;height:100%;overflow:hidden}
body{font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased;background:#FFFFFF;font-weight:400;display:flex;flex-direction:column}
#app{max-width:520px;margin:0 auto;width:100%;height:100vh;background:var(--bg);position:relative;display:flex;flex-direction:column;box-shadow:0 0 80px rgba(0,0,0,0.04);overflow:hidden}
.hidden{display:none !important}

/* ====== PANTALLA DE BIENVENIDA ====== */
.welcome-screen{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center;animation:fade .4s}
@keyframes floatHamburger {
  0% { transform: translateY(0px) rotate(0deg); }
  50% { transform: translateY(-12px) rotate(4deg); }
  100% { transform: translateY(0px) rotate(0deg); }
}
.welcome-avatar{width:120px;height:120px;border-radius:50%;background:linear-gradient(135deg, var(--brand-2), var(--brand));display:grid;place-items:center;font-size:60px;margin-bottom:24px;box-shadow:0 16px 40px var(--brand-glow);animation:floatHamburger 3s ease-in-out infinite}
.welcome-title{font-size:28px;font-weight:800;letter-spacing:-.8px;margin:0 0 12px;color:var(--ink);line-height:1.2}
.welcome-sub{font-size:15px;color:var(--muted);line-height:1.6;margin:0 0 32px;max-width:320px}
.input-wrap{width:100%;max-width:320px}
.name-input{width:100%;padding:18px;border-radius:16px;border:1px solid var(--line);background:var(--surface-2);font-size:16px;font-family:inherit;outline:none;color:var(--ink);text-align:center;font-weight:600;transition:.2s}
.name-input::placeholder{color:var(--muted-2);font-weight:400}
.name-input:focus{border-color:var(--brand);background:var(--surface);box-shadow:0 0 0 4px var(--brand-soft)}
.btn-start{width:100%;margin-top:14px;padding:18px;border-radius:16px;border:none;background:linear-gradient(135deg, var(--brand-2), var(--brand));color:#FFFFFF;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 8px 24px var(--brand-glow);transition:.2s}
.btn-start:active{transform:scale(.98)}
.btn-start:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}

/* ====== HEADER ====== */
.mini-hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:1px solid var(--line);background:rgba(255,255,255,0.92);backdrop-filter:blur(16px);z-index:10}
.mini-brand{display:flex;align-items:center;gap:10px}
.mini-logo{width:40px;height:40px;border-radius:12px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-size:20px;overflow:hidden;position:relative}
.mini-logo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mini-brand h1{margin:0;font-size:16px;font-weight:700;letter-spacing:-.3px}
.mini-brand p{margin:2px 0 0;font-size:11px;color:var(--muted);font-weight:500}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:18px;display:grid;place-items:center;cursor:pointer;transition:.2s}
.icon-btn:active{transform:scale(.94);background:var(--surface-2)}
.btn-back{width:auto;padding:0 12px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;}
.cart-btn{position:relative}
.cart-badge{position:absolute;top:-4px;right:-4px;background:var(--brand);color:#fff;font-size:10px;font-weight:800;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;border:2px solid #fff}

/* ====== CHAT UI ====== */
.chat-container{flex:1;overflow-y:auto;padding:20px 18px;display:flex;flex-direction:column;gap:16px;scroll-behavior:smooth;padding-bottom:100px}
.chat-msg{display:flex;gap:12px;max-width:90%;animation:slideUp .3s ease}
.chat-msg.bot{align-self:flex-start}
.chat-msg.user{align-self:flex-end;flex-direction:row-reverse}
@keyframes slideUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.msg-avatar{width:36px;height:36px;border-radius:50%;background:var(--brand-soft);display:grid;place-items:center;font-size:18px;flex:none;box-shadow:var(--shadow-sm);border:1px solid var(--brand-soft)}
.msg-bubble{background:var(--surface-2);padding:14px 18px;border-radius:18px 18px 18px 4px;font-size:14px;color:var(--ink);line-height:1.5;box-shadow:var(--shadow-sm);border:1px solid var(--line)}
.chat-msg.user .msg-bubble{background:var(--brand);color:#fff;border:none;border-radius:18px 18px 4px 18px;box-shadow:0 4px 12px var(--brand-glow)}

/* ====== OPCIONES Y PRODUCTOS ====== */
.options-container{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px;animation:fade .4s}
.opt-cat{flex:1 1 calc(50% - 12px);background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:.2s;box-shadow:var(--shadow-sm)}
.opt-cat:active{transform:scale(.96);border-color:var(--brand)}
.opt-cat .emoji{font-size:36px}
.opt-cat .name{font-size:14px;font-weight:600;color:var(--ink);text-align:center}

/* TARJETA DE PRODUCTO TIPO BANNER GRANDE */
.prod-opt{flex:1 1 100%;background:#fff;border:1px solid var(--line);border-radius:20px;display:flex;flex-direction:column;overflow:hidden;cursor:pointer;transition:.2s;box-shadow:var(--shadow-sm);position:relative;margin-bottom:12px;}
.prod-opt:active{transform:scale(.98);border-color:var(--brand)}
.p-img-banner{width:100%;height:220px;background:var(--surface-2);display:grid;place-items:center;position:relative;overflow:hidden}
.p-img-banner img{width:100%;height:100%;object-fit:cover}
.p-img-banner span{font-size:80px}
.p-details{padding:18px;display:flex;flex-direction:column;gap:8px}
.p-info{flex:1;min-width:0}
.p-name{font-size:18px;font-weight:800;color:var(--ink);margin-bottom:4px;line-height:1.2}
.p-desc{font-size:13px;color:var(--muted);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.p-price-row{display:flex;align-items:center;justify-content:space-between;margin-top:8px;}
.p-price{font-size:22px;font-weight:900;color:var(--brand);display:flex;flex-direction:column;line-height:1.1;}
.price-ves{font-size:12px;color:var(--muted);font-weight:600;margin-top:4px; display: block; text-align: right;}
.p-add{width:44px;height:44px;border-radius:14px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-size:24px;font-weight:bold;flex:none;transition:0.2s}
.prod-opt:active .p-add{background:var(--brand);color:#fff}

.action-btn{width:100%;padding:16px;border-radius:14px;border:none;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:.2s;margin-top:6px;display:flex;align-items:center;justify-content:center;gap:8px}
.action-btn.primary{background:linear-gradient(135deg, var(--brand-2), var(--brand));color:#fff;box-shadow:0 4px 14px var(--brand-glow)}
.action-btn.primary:active{transform:scale(.97)}
.action-btn.secondary{background:var(--surface-2);color:var(--ink);border:1px solid var(--line); margin-top: 12px;}
.action-btn.secondary:active{background:var(--line)}

/* ====== VISTAS (CARRITO/CHECKOUT) ====== */
.view-overlay{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;animation:up .3s ease}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.view-hdr{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);background:#fff}
.view-hdr .back-btn{background:none;border:none;font-size:22px;cursor:pointer;color:var(--ink);padding:8px;font-weight:800; display: flex; align-items: center; gap: 6px; font-size: 14px;}
.view-hdr h2{margin:0;font-size:18px;font-weight:800;flex:1;text-align:center;margin-right:32px}
.view-body{flex:1;overflow-y:auto;padding:20px;padding-bottom:100px}

.cart-item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px;display:flex;gap:14px;align-items:flex-start}
.ci-emoji{width:70px;height:70px;border-radius:12px;display:grid;place-items:center;font-size:28px;background:var(--surface-2);flex:none;overflow:hidden;position:relative}
.ci-emoji img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ci-info{flex:1;min-width:0}
.ci-info h4{margin:0 0 4px;font-size:15px;font-weight:700}
.ci-info .extras{font-size:11.5px;color:var(--muted);line-height:1.5;margin:0}
.ci-right{display:flex;flex-direction:column;align-items:flex-end;gap:10px;flex:none}
.ci-price{font-size:16px;font-weight:800;color:var(--brand);display:flex;flex-direction:column;align-items:flex-end; text-align: right;}

/* BOTONES MINIMALISTAS DE CANTIDAD */
.qty{display:flex;align-items:center;gap:6px;}
.qty button{width:28px;height:28px;border:none;background:transparent;border-radius:8px;font-size:20px;font-weight:500;cursor:pointer;color:var(--ink);display:grid;place-items:center;transition:.2s;}
.qty button:active{background:var(--surface-2);transform:scale(.9);}
.qty span{min-width:20px;text-align:center;font-size:15px;font-weight:800;}

.totals{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;margin-top:20px}
.trow{display:flex;justify-content:space-between;align-items:flex-start;font-size:13.5px;padding:7px 0;color:var(--muted)}
.trow.total{font-size:19px;font-weight:800;color:var(--ink);border-top:1px solid var(--line);margin-top:12px;padding-top:16px}
.trow b{color:var(--ink); font-weight: 600;}
.text-right { text-align: right; }

.btn-primary{width:100%;padding:16px;border-radius:14px;border:none;background:linear-gradient(135deg, var(--brand-2), var(--brand));color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 6px 20px var(--brand-glow);margin-top:16px}
.btn-wa{background:var(--wa);box-shadow:0 6px 20px rgba(37,211,102,0.28);margin-top:18px}

/* ====== BOTONERA INFERIOR ====== */
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;z-index:50;background:rgba(255,255,255,0.96);backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom))}
.nav-btn{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;font-weight:600;color:var(--muted);cursor:pointer;padding:8px 0;position:relative;transition:.2s}
.nav-btn .ni{font-size:22px;line-height:1}
.nav-btn.active{color:var(--brand)}
.nav-badge{position:absolute;top:2px;right:50%;margin-right:-26px;background:var(--brand);color:#FFFFFF;font-size:9.5px;font-weight:800;min-width:18px;height:18px;border-radius:10px;display:grid;place-items:center;padding:0 5px;border:2px solid #fff}

/* MODAL Y UTILS */
.modal{position:fixed;inset:0;z-index:100;background:rgba(26,29,33,0.5);backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;animation:fade .25s}
.sheet{width:100%;max-width:520px;background:var(--surface);border-radius:28px 28px 0 0;max-height:92vh;overflow-y:auto;animation:up .35s cubic-bezier(.2,.9,.3,1);border:1px solid var(--line);border-bottom:none}
.sheet-hero{position:relative;width:100%;height:220px;background:var(--surface-2);display:grid;place-items:center;overflow:hidden;border-radius:28px 28px 0 0}
.sheet-hero-emoji{font-size:100px;opacity:.35;position:absolute}
.sheet-hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sheet-close{position:absolute;top:16px;right:16px;z-index:4;width:40px;height:40px;border-radius:50%;border:none;background:rgba(255,255,255,0.95);font-size:18px;cursor:pointer;box-shadow:var(--shadow-sm)}
.sheet-body{padding:22px}
.sheet-body h2{margin:0 0 4px;font-size:22px;font-weight:800}
.sheet-body .desc{font-size:13.5px;color:var(--muted);margin:0 0 20px;line-height:1.6}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:9px;cursor:pointer;font-size:13.5px;font-weight:500}
.opt:has(input:checked){border-color:var(--brand);background:var(--brand-soft)}
.opt input{display:none}
.opt .box{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;flex:none;font-size:13px;color:transparent;background:var(--surface-2)}
.opt:has(input:checked) .box{background:var(--brand);border-color:var(--brand);color:#fff}
.qty-row{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:20px 0}
.qty-row .qty button{width:44px;height:44px;font-size:22px; background:var(--surface-2); border-radius:12px;}
.qty-row .qty span{font-size:18px;min-width:40px}

.field{margin-bottom:18px}
.field label{display:block;font-size:12.5px;font-weight:600;margin-bottom:8px;color:var(--ink-2)}
.field input,.field textarea,.field select{width:100%;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-family:inherit;outline:none;transition:.2s}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
.field textarea{resize:vertical;min-height:80px}
.seg{display:flex;gap:10px}
.seg label{flex:1;border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center;cursor:pointer;font-size:13px;font-weight:500;background:var(--surface);color:var(--muted)}
.seg input{display:none}
.seg label:has(input:checked){border-color:var(--brand);background:var(--brand-soft);color:var(--brand);font-weight:600}

.proof-picker{position:relative;width:100%;min-height:110px;background:var(--surface-2);border:2px dashed var(--line-2);border-radius:14px;display:grid;place-items:center;cursor:pointer;padding:16px}
.proof-picker input{display:none}
.proof-preview{position:relative;width:100%;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#000}
.proof-preview img{width:100%;max-height:250px;object-fit:contain;display:block}
.proof-remove{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,0.6);color:#fff;border:none;font-size:14px}

.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);z-index:200;background:var(--ink);color:#fff;padding:14px 22px;border-radius:12px;font-size:13.5px;opacity:0;pointer-events:none;transition:.3s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-10px)}

/* MAPA ESTILO TARJETA */
#mapPreviewContainer { position: relative; margin-bottom: 20px; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); box-shadow: var(--shadow-sm); height: 180px; background: var(--surface-2); }
#mapPreviewIframe { width: 100%; height: 100%; border: 0; pointer-events: none; } /* Desactiva interacciones del iframe */
.map-overlay-btn { position: absolute; bottom: 10px; right: 10px; background: #fff; color: var(--ink); padding: 8px 14px; border-radius: 8px; font-size: 12px; font-weight: 700; text-decoration: none; display: flex; align-items: center; gap: 6px; box-shadow: 0 4px 10px rgba(0,0,0,0.15); transition: 0.2s; z-index: 10; border: 1px solid var(--line); }
.map-overlay-btn:active { transform: scale(0.95); }
</style>
</head>
<body>

<!-- PANTALLA 1: BIENVENIDA -->
<div id="welcomeScreen" class="welcome-screen">
  <div class="welcome-avatar" id="welcomeBot">🍔</div>
  <h1 class="welcome-title">¡Bienvenido a <span id="welcomeBrand">Rapid Burger</span>!</h1>
  <p class="welcome-sub">Soy tu asistente. Escribe tu nombre y te guiaré paso a paso para armar tu pedido perfecto.</p>
  <div class="input-wrap">
    <input id="nameInput" class="name-input" type="text" placeholder="Tu nombre aquí..." maxlength="30" autocomplete="off">
    <button id="startBtn" class="btn-start" disabled>Comenzar pedido →</button>
  </div>
</div>

<!-- APP PRINCIPAL -->
<div id="app" class="hidden">
  <header class="mini-hdr">
    <div class="mini-brand">
      <div class="mini-logo" id="brandLogo">🍔</div>
      <div>
        <h1 id="brandName">Rapid Burger</h1>
        <p id="storeStatus">Abierto ahora</p>
      </div>
    </div>
    <button class="icon-btn btn-back" onclick="goBack()" title="Regresar">
      <span style="font-size:18px; line-height:1;">←</span> Regresar
    </button>
  </header>

  <div id="chatContainer" class="chat-container">
    <!-- Aquí se inyectan los mensajes del bot y las opciones -->
  </div>
</div>

<!-- VISTA CARRITO / CHECKOUT -->
<div id="viewCart" class="view-overlay hidden">
  <div class="view-hdr" style="justify-content: space-between;">
    <button class="back-btn" onclick="closeView('viewCart')"><span style="font-size:18px; line-height:1;">←</span> Regresar</button>
    <h2>Tu Pedido</h2>
    <div style="width:80px"></div>
  </div>
  <div class="view-body" id="cartBody">
    <!-- Renderizado dinámico -->
  </div>
</div>

<div id="viewCheckout" class="view-overlay hidden">
  <div class="view-hdr">
    <button class="back-btn" onclick="closeView('viewCheckout')"><span style="font-size:18px; line-height:1;">←</span> Regresar</button>
    <h2>Finalizar Pedido</h2>
  </div>
  <div class="view-body">
    <div class="field"><label>Nombre y apellido *</label><input id="f-name" type="text"></div>
    <div class="field"><label>Teléfono / WhatsApp *</label><input id="f-phone" type="tel"></div>
    
    <div class="field">
      <label>¿Cómo lo quieres? *</label>
      <div class="seg">
        <label><input type="radio" name="otype" value="delivery" checked onchange="updateOrderType()"><span>🛵 Delivery</span></label>
        <label><input type="radio" name="otype" value="pickup" onchange="updateOrderType()"><span>🏪 Retiro</span></label>
      </div>
    </div>

    <div id="addressBlock">
      <div class="field"><label>Dirección de entrega *</label><textarea id="f-addr" placeholder="Calle, número, sector..."></textarea></div>
      <div class="field"><label>Punto de referencia</label><input id="f-ref" type="text" placeholder="Ej: frente a la panadería"></div>
      
      <button type="button" class="btn-start" style="background:var(--surface-2);color:var(--ink);box-shadow:none;border:1px dashed var(--line-2);font-size:13px;padding:12px;margin-bottom:12px" onclick="getLocation()" id="btnLocation">📍 Compartir ubicación (Maps)</button>
      
      <!-- 👇 MAPA ESTILO TARJETA CON BOTÓN A GOOGLE MAPS -->
      <div id="mapPreviewContainer" class="hidden">
        <iframe id="mapPreviewIframe" src="" allowfullscreen="" loading="lazy"></iframe>
        <a id="mapExternalLink" href="#" target="_blank" class="map-overlay-btn">
          <span>🗺️</span> Abrir en Maps
        </a>
      </div>

    </div>

    <div class="field">
      <label>Método de pago *</label>
      <select id="paySelect"></select>
      <div id="payDetails" style="margin-top:10px; font-size:13px; color:var(--ink-2); line-height:1.6;"></div>
      
      <div id="proofField" style="margin-top:16px" class="hidden">
        <label>Comprobante de pago</label>
        <div id="proofPickerWrap">
          <div class="proof-picker" onclick="document.getElementById('proofFile').click()">
            <input type="file" accept="image/*" id="proofFile" onchange="handleProofUpload(event)">
            <div style="text-align:center"><span style="font-size:24px">📷</span><p style="margin:4px 0 0;font-size:12px;font-weight:600">Subir comprobante</p></div>
          </div>
        </div>
        <div id="proofPreviewWrap" class="hidden">
          <div class="proof-preview">
            <img id="proofImg">
            <button class="proof-remove" onclick="clearProof()">✕</button>
          </div>
        </div>
      </div>
    </div>

    <div class="field"><label>Notas para la cocina</label><textarea id="f-notes" placeholder="Ej: sin cebolla..."></textarea></div>
    
    <div id="checkoutSummary"></div>
    
    <button class="btn-primary btn-wa" onclick="submitOrder()" id="btnConfirm">📲 Confirmar y enviar por WhatsApp</button>
  </div>
</div>

<!-- BOTONERA INFERIOR -->
<nav class="bottom-nav" id="bottomNav">

<script>
var CONFIG = {
  brand: "Rapid Burger", logo: "", whatsapp: "584121234567",
  payments: [], deliveryFee: 2.00, currency: "$"
};

var DB = { cats: [], menu: [] };
var EXCHANGE_RATE = null;
var DETAIL_LABELS = { banco:"Banco", telefono:"Teléfono", cedula:"Cédula / RIF", cuenta:"Número de cuenta", titular:"Titular", rif:"RIF", email:"Correo" };

var state = { 
  clientName: "", cart: [], proofImage: null, userLocationUrl: null,
  wizardStep: "food"
};

function $(s, r){ r = r || document; return r.querySelector(s); }
function $$(s, r){ r = r || document; return Array.prototype.slice.call(r.querySelectorAll(s)); }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function money(n) {
  const rate = EXCHANGE_RATE || 36.50; 
  const usdStr = CONFIG.currency + Number(n).toFixed(2);
  const bsStr = (n * rate).toFixed(2);
  return `${usdStr}<span class="price-ves">Bs. ${bsStr}</span>`;
}

function toast(msg){ var t = $("#toast"); t.textContent = msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"), 2500); }
function scrollToBottom(){ var c = $("#chatContainer"); c.scrollTop = c.scrollHeight; }

function copyToClipboard(text) {
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(() => toast("✅ Copiado")).catch(() => fallbackCopy(text));
  } else {
    fallbackCopy(text);
  }
}
function fallbackCopy(text) {
  var t = document.createElement("textarea"); t.value = text; document.body.appendChild(t); t.select();
  try { document.execCommand('copy'); toast("✅ Copiado"); } catch(e) { toast("❌ Error"); }
  t.remove();
}

async function fetchExchangeRate() {
  const cached = localStorage.getItem('bcv_rate');
  if (cached) EXCHANGE_RATE = parseFloat(cached);

  try {
    let res = await fetch("https://ve.dolarapi.com/v1/dolares/oficial");
    let data = await res.json();
    if (data && data.promedio) {
      EXCHANGE_RATE = parseFloat(data.promedio);
      localStorage.setItem('bcv_rate', EXCHANGE_RATE);
      return;
    }
  } catch (e) { console.warn("Fallo dolarapi, intentando pydolarve..."); }

  try {
    let res = await fetch("https://pydolarve.org/api/v1/dollar?page=bcv");
    if (res.ok) {
      let data = await res.json();
      if (data && data.monitors && data.monitors.bcv && data.monitors.bcv.price) {
        EXCHANGE_RATE = parseFloat(data.monitors.bcv.price);
        localStorage.setItem('bcv_rate', EXCHANGE_RATE);
        return;
      }
    }
  } catch (e) { console.warn("Fallo pydolarve también."); }

  if (!EXCHANGE_RATE) EXCHANGE_RATE = 36.50;
}

const DEFAULT_CATS = [
  { id: '1', name: 'Hamburguesas', icon: '🍔' },
  { id: '2', name: 'Perros Calientes', icon: '🌭' },
  { id: '3', name: 'Bebidas', icon: '🥤' },
  { id: '4', name: 'Postres', icon: '🍰' }
];

function getCategoryName(id) {
  const cat = DB.cats.find(c => c.id === id);
  return cat ? cat.name.toLowerCase() : '';
}
function findCategoryByKeywords(keys) {
  return DB.cats.find(c => keys.some(k => c.name.toLowerCase().includes(k)));
}

async function loadData() {
  await fetchExchangeRate(); 

  try {
    const [configRes, catsRes, prodsRes] = await Promise.all([
      supabaseClient.from('config').select('*').eq('id', 1).single(),
      supabaseClient.from('categories').select('*'),
      supabaseClient.from('products').select('*')
    ]);

    if (configRes.data) {
      CONFIG.brand = configRes.data.brand || CONFIG.brand;
      CONFIG.logo = configRes.data.logo || "";
      CONFIG.whatsapp = configRes.data.whatsapp || CONFIG.whatsapp;
      CONFIG.payments = configRes.data.payments || [];
      CONFIG.deliveryFee = configRes.data.deliveryfee || CONFIG.deliveryFee;
    }
    
    $("#welcomeBrand").textContent = CONFIG.brand;
    $("#brandName").textContent = CONFIG.brand;
    if (CONFIG.logo) {
      $("#welcomeBot").innerHTML = `<img src="${esc(CONFIG.logo)}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`;
      $("#brandLogo").innerHTML = `<img src="${esc(CONFIG.logo)}">`;
    }

    if (catsRes.data && catsRes.data.length > 0) {
      DB.cats = catsRes.data;
    } else {
      DB.cats = DEFAULT_CATS;
    }

    if (prodsRes.data && prodsRes.data.length > 0) {
      DB.menu = prodsRes.data.map(p => ({ ...p, cat: p.category_id, desc: p.description, extras: p.extras || [], available: p.available !== false }));
    } else {
      DB.menu = [
        { id: 'p1', cat: '1', name: 'Hamburguesa Clásica', price: 5.00, emoji: '🍔', desc: 'Carne, queso y vegetales' },
        { id: 'p2', cat: '3', name: 'Refresco', price: 1.50, emoji: '🥤', desc: 'Bebida fría' },
        { id: 'p3', cat: '4', name: 'Helado', price: 2.00, emoji: '🍦', desc: 'Postre dulce' }
      ];
    }
  } catch(e) { 
    console.warn("Usando datos por defecto por error de conexión:", e);
    DB.cats = DEFAULT_CATS; 
  }
}

function setupWelcome() {
  const nameInput = $("#nameInput");
  const startBtn = $("#startBtn");

  nameInput.addEventListener("input", () => {
    startBtn.disabled = nameInput.value.trim().length === 0;
  });
  nameInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !startBtn.disabled) startBtn.click();
  });

  startBtn.addEventListener("click", () => {
    const name = nameInput.value.trim();
    if (!name) return;
    state.clientName = name;
    localStorage.setItem('ff_client_name', name);
    
    $("#welcomeScreen").classList.add("hidden");
    $("#app").classList.remove("hidden");
    
    startChatWizard();
  });
}

function addBotMsg(html) {
  $("#chatContainer").insertAdjacentHTML("beforeend", `
    <div class="chat-msg bot">
      <div class="msg-avatar">🍔</div>
      <div class="msg-bubble">${html}</div>
    </div>
  `);
  scrollToBottom();
}

function addUserMsg(text) {
  $("#chatContainer").insertAdjacentHTML("beforeend", `
    <div class="chat-msg user">
      <div class="msg-bubble">${esc(text)}</div>
    </div>
  `);
  scrollToBottom();
}

function renderOptions(html) {
  $("#chatContainer").insertAdjacentHTML("beforeend", `<div class="options-container">${html}</div>`);
  scrollToBottom();
}

function startChatWizard() {
  $("#chatContainer").innerHTML = "";
  addBotMsg(`¡Hola <b>${esc(state.clientName)}</b>! 🎉 Qué bueno verte. Para empezar, elige qué se te antoja:`);
  showCategories();
}

function showCategories() {
  let html = "";
  DB.cats.forEach(c => {
    html += `
      <div class="opt-cat" onclick="selectCategory('${c.id}', '${esc(c.name)}')">
        <span class="emoji">${c.icon || '📁'}</span>
        <span class="name">${esc(c.name)}</span>
      </div>
    `;
  });
  renderOptions(html);
}

function selectCategory(catId, catName) {
  addUserMsg(catName);
  $("#chatContainer").querySelectorAll(".options-container").forEach(el => el.remove());
  
  const prods = DB.menu.filter(p => p.cat === catId && p.available !== false);
  if (!prods.length) {
    addBotMsg(`Vaya, por ahora no tenemos productos en <b>${esc(catName)}</b>. ¿Quieres elegir otra cosa?`);
    showCategories();
    return;
  }

  let html = "";
  prods.forEach(p => {
    html += `
      <div class="prod-opt" onclick="openProductModal('${p.id}', '${catId}')">
        <div class="p-img-banner">
          ${p.img ? `<img src="${esc(p.img)}">` : `<span>${p.emoji}</span>`}
        </div>
        <div class="p-details">
          <div class="p-info">
            <div class="p-name">${esc(p.name)}</div>
            <div class="p-desc">${esc(p.desc || '')}</div>
          </div>
          <div class="p-price-row">
            <div class="p-price">${money(p.price)}</div>
            <div class="p-add">+</div>
          </div>
        </div>
      </div>
    `;
  });

  const catNameLower = catName.toLowerCase();
  let btnText = "Siguiente paso ➔";
  if (catNameLower.includes('bebida') || catNameLower.includes('refresco') || catNameLower.includes('jugo')) {
    btnText = "Omitir bebida / Ir a postres ➔";
  } else if (catNameLower.includes('postre') || catNameLower.includes('dulce') || catNameLower.includes('torta') || catNameLower.includes('helado')) {
    btnText = "Omitir postre / Finalizar pedido ➔";
  } else if (catNameLower.includes('hamburguesa') || catNameLower.includes('perro') || catNameLower.includes('pollo') || catNameLower.includes('chawarma')) {
    btnText = "Omitir plato / Ir a bebidas ➔";
  }
  
  html += `<button class="action-btn secondary" onclick="skipStep('${catId}')">${btnText}</button>`;

  renderOptions(html);
}

function openProductModal(id, catId) {
  const p = DB.menu.find(x => x.id === id);
  state.modal = { product: p, qty: 1, extras: [], notes: "" };
  renderModal(catId);
  $("#modal").classList.remove("hidden");
}

function closeModal() { $("#modal").classList.add("hidden"); state.modal = null; }

function renderModal(catId) {
  const m = state.modal; const p = m.product;
  const extrasHtml = p.extras.map(e => `
    <label class="opt">
      <span>${esc(e.name)} +${money(e.price)}</span>
      <span style="display:flex;gap:10px">
        <input type="checkbox" ${m.extras.includes(e.name) ? 'checked' : ''} onchange="toggleExtra('${esc(e.name)}', this.checked)">
        <span class="box">✓</span>
      </span>
    </label>
  `).join("");

  $("#modal").innerHTML = `
    <div class="sheet">
      <div class="sheet-hero">
        <span class="sheet-hero-emoji">${p.emoji}</span>
        ${p.img ? `<img src="${esc(p.img)}">` : ''}
        <button class="sheet-close" onclick="closeModal()">✕</button>
      </div>
      <div class="sheet-body">
        <h2>${esc(p.name)}</h2>
        <p class="desc">${esc(p.desc)}</p>
        ${extrasHtml}
        <div class="field"><label>Instrucciones</label><input type="text" oninput="state.modal.notes=this.value" placeholder="Ej: sin cebolla" value="${esc(m.notes)}"></div>
        <div class="qty-row">
          <div class="qty"><button onclick="updateModalQty(-1)">−</button><span id="mQtyDisplay">${m.qty}</span><button onclick="updateModalQty(1)">+</button></div>
          <div style="font-size:24px;font-weight:900;color:var(--brand); display:flex; flex-direction:column; text-align: right;" id="mUnit">${money((p.price + p.extras.filter(e=>m.extras.includes(e.name)).reduce((a,e)=>a+e.price,0)) * m.qty)}</div>
        </div>
        <button class="btn-primary" onclick="addToCartAndAdvance('${catId}')">Agregar al pedido</button>
      </div>
    </div>`;
}

function updateModalQty(delta) {
  var m = state.modal; if (!m) return;
  m.qty = Math.max(1, m.qty + delta);
  $("#mQtyDisplay").textContent = m.qty;
  updateModalPrice();
}

function updateModalPrice() {
  var m = state.modal; if (!m) return;
  var p = m.product;
  var price = (p.price + p.extras.filter(e=>m.extras.includes(e.name)).reduce((a,e)=>a+e.price,0)) * m.qty;
  $("#mUnit").innerHTML = money(price);
}

function toggleExtra(name, on){ 
  if(on) { if(!state.modal.extras.includes(name)) state.modal.extras.push(name); } 
  else { state.modal.extras = state.modal.extras.filter(x=>x!==name); }
  updateModalPrice(); 
}

function addToCartAndAdvance(catId) {
  const m = state.modal; const p = m.product;
  const key = p.id + "|" + m.extras.sort().join(",") + "|" + m.notes;
  const unit = p.price + p.extras.filter(e=>m.extras.includes(e.name)).reduce((a,e)=>a+e.price,0);
  
  const found = state.cart.find(i => i.key === key);
  if (found) found.qty += m.qty;
  else state.cart.push({ key, id: p.id, name: p.name, emoji: p.emoji, img: p.img, extras: p.extras.filter(e=>m.extras.includes(e.name)), notes: m.notes, unit, qty: m.qty });
  
  updateBadge();
  closeModal();
  
  addUserMsg(`${m.qty}x ${p.name}`);
  addBotMsg(`¡Agregado a tu pedido! 😋 ¿Quieres algo más de esta categoría o pasamos a la siguiente?`);
}

function skipStep(catId) {
  const catName = getCategoryName(catId);
  addUserMsg("Siguiente paso / Omitir");
  $("#chatContainer").querySelectorAll(".options-container").forEach(el => el.remove());

  const catNameLower = catName.toLowerCase();
  
  if (catNameLower.includes('bebida') || catNameLower.includes('refresco') || catNameLower.includes('jugo')) {
    state.wizardStep = "dessert";
    const dessertCat = findCategoryByKeywords(['postre', 'dulce', 'torta', 'helado']);
    if (dessertCat) {
      addBotMsg(`¡Genial! 🥤 ¿Se te antoja un postre para cerrar con broche de oro? Te muestro los <b>${esc(dessertCat.name)}</b> 🍰.`);
      setTimeout(() => selectCategory(dessertCat.id, dessertCat.name), 800);
    } else {
      askForMore();
    }
  } 
  else if (catNameLower.includes('postre') || catNameLower.includes('dulce') || catNameLower.includes('torta') || catNameLower.includes('helado')) {
    state.wizardStep = "upsell";
    askForMore();
  } 
  else {
    state.wizardStep = "drink";
    const drinkCat = findCategoryByKeywords(['bebida', 'refresco', 'jugo', 'malta']);
    if (drinkCat) {
      addBotMsg(`¡Excelente elección! 😋 ¿Y para tomar? Te sugiero algo de nuestra sección de <b>${esc(drinkCat.name)}</b> 🥤.`);
      setTimeout(() => selectCategory(drinkCat.id, drinkCat.name), 800);
    } else {
      askForMore();
    }
  }
}

function askForMore() {
  addBotMsg(`¡Felicidades <b>${esc(state.clientName)}</b>! 🎉 Ya tienes tu pedido completo. ¿Quieres pedir algo más o prefieres ir al carrito?`);
  
  let html = `
    <button class="action-btn primary" onclick="goToCart()">🛒 Ir al carrito</button>
    <button class="action-btn secondary" onclick="continueOrdering()">➕ Pedir algo más</button>
  `;
  renderOptions(html);
}

function continueOrdering() {
  addUserMsg("Quiero pedir algo más");
  $("#chatContainer").querySelectorAll(".options-container").forEach(el => el.remove());
  addBotMsg("¡Claro que sí! ¿Qué más se te antoja?");
  setTimeout(() => showCategories(), 400);
}

function updateBadge() {
  const n = state.cart.reduce((a,i)=>a+i.qty,0);
  const b = $("#cartBadge");
  b.textContent = n;
  b.classList.toggle("hidden", n === 0);
}

// === LÓGICA BOTONERA Y REGRESAR ===
function showCategoriesView() {
  $("#viewCart").classList.add("hidden");
  $("#viewCheckout").classList.add("hidden");
  startChatWizard();
}

function focusAssistant() {
  $("#viewCart").classList.add("hidden");
  $("#viewCheckout").classList.add("hidden");
  if ($("#chatContainer").innerHTML.trim() === "") {
    startChatWizard();
  } else {
    addBotMsg("¿En qué más te puedo ayudar? Puedes elegir una categoría abajo o ver tu carrito.");
    if (!$("#chatContainer").querySelector(".options-container")) {
      showCategories();
    }
    scrollToBottom();
  }
}

function openHelp() {
  let msg = `¡Hola! Somos <b>${CONFIG.brand}</b> 🍔. ¿Necesitas ayuda con tu pedido?`;
  let html = `<button class="action-btn primary" onclick="window.open('https://wa.me/${CONFIG.whatsapp}?text=Hola,%20necesito%20ayuda')">💬 Chatear con un asesor</button>`;
  $("#chatContainer").insertAdjacentHTML("beforeend", `
    <div class="chat-msg bot">
      <div class="msg-avatar">🍔</div>
      <div class="msg-bubble">${msg}</div>
    </div>
  `);
  renderOptions(html);
}

function goBack() {
  $("#viewCheckout").classList.add("hidden");
  $("#viewCart").classList.add("hidden");
  startChatWizard();
}

function goToCart() {
  if (state.cart.length === 0) { toast("El carrito está vacío"); return; }
  renderCart();
  $("#viewCart").classList.remove("hidden");
}

function closeView(id) { $("#" + id).classList.add("hidden"); }

function renderCart() {
  const body = $("#cartBody");
  let html = state.cart.map(i => `
    <div class="cart-item">
      <div class="ci-emoji">${i.img ? `<img src="${esc(i.img)}">` : i.emoji}</div>
      <div class="ci-info">
        <h4>${esc(i.name)}</h4>
        ${i.extras.length ? `<p class="extras">+ ${i.extras.map(e=>esc(e.name)).join(", ")}</p>` : ''}
      </div>
      <div class="ci-right">
        <div class="ci-price">${money(i.unit * i.qty)}</div>
        <div class="qty">
          <button onclick="changeQty('${i.key}',-1)">−</button>
          <span>${i.qty}</span>
          <button onclick="changeQty('${i.key}',1)">+</button>
        </div>
      </div>
    </div>
  `).join("");

  const sub = state.cart.reduce((a,i)=>a+i.unit*i.qty,0);

  html += `
    <div class="totals">
      <div class="trow total" style="border-top: none; margin-top: 0; padding-top: 0; font-size: 20px;">
        <span>Total productos</span>
        <div class="text-right">${money(sub)}</div>
      </div>
    </div>
    <button class="btn-primary" onclick="goToCheckout()">Continuar con el pedido →</button>
  `;
  body.innerHTML = html;
}

function changeQty(key, d) {
  const it = state.cart.find(i => i.key === key); if(!it) return;
  it.qty += d; 
  if(it.qty <= 0) state.cart = state.cart.filter(i=>i.key!==key);
  updateBadge(); 
  renderCart();
  if (state.cart.length === 0) closeView('viewCart');
}

function goToCheckout() {
  closeView('viewCart');
  $("#f-name").value = state.clientName;
  renderPayments();
  updateOrderType();
  $("#viewCheckout").classList.remove("hidden");
}

function renderPayments() {
  const sel = $("#paySelect");
  sel.innerHTML = CONFIG.payments.map((p, i) => `<option value="${p.id}" ${i===0?'selected':''}>${p.icon} ${p.label}</option>`).join("");
  sel.onchange = updatePayDetails;
  updatePayDetails();
}

function updatePayDetails() {
  const p = CONFIG.payments.find(x => x.id === $("#paySelect").value);
  const box = $("#payDetails");
  const field = $("#proofField");
  
  if (!p || ["efectivo", "tarjeta", "otro"].includes(p.type)) {
    box.innerHTML = "";
    field.classList.add("hidden");
    return;
  }
  
  if (p.details) {
    let htmlDetails = '';
    let copyText = `Datos de Pago (${p.label}):\n`;
    
    if (p.type === 'pagomovil') {
      if(p.details.banco) { htmlDetails += `<div><b>Banco:</b> ${esc(p.details.banco)}</div>`; copyText += `Banco: ${p.details.banco}\n`; }
      if(p.details.cedula) { htmlDetails += `<div><b>Cédula:</b> ${esc(p.details.cedula)}</div>`; copyText += `Cédula: ${p.details.cedula}\n`; }
      if(p.details.telefono) { htmlDetails += `<div><b>Teléfono:</b> ${esc(p.details.telefono)}</div>`; copyText += `Teléfono: ${p.details.telefono}\n`; }
    } else {
      Object.entries(p.details).forEach(([k,v]) => {
        if(v) {
          let label = DETAIL_LABELS[k] || k;
          htmlDetails += `<div><b>${label}:</b> ${esc(v)}</div>`;
          copyText += `${label}: ${v}\n`;
        }
      });
    }
    
    const isDel = $("input[name='otype']:checked").value === 'delivery';
    const sub = state.cart.reduce((a,i)=>a+i.unit*i.qty,0);
    const del = isDel ? CONFIG.deliveryFee : 0;
    const totalUsd = sub + del;
    const totalBs = (totalUsd * (EXCHANGE_RATE || 1)).toFixed(2);
    
    copyText += `\nTotal a pagar: Bs. ${totalBs}`;
    
    box.innerHTML = `
      <div style="display:flex; flex-direction:column; gap:6px; margin-bottom:12px; background:var(--surface-2); padding:14px; border-radius:12px;">
        ${htmlDetails}
      </div>
      <button class="btn-start" style="background:var(--brand-soft); color:var(--brand); border:1px solid var(--brand); font-size:13px; padding:10px; margin-top:0; width:100%;" onclick="copyToClipboard('${esc(copyText.replace(/\n/g, '\\n'))}')">
        📋 Copiar datos y total (Bs. ${totalBs})
      </button>
    `;
  }
  
  field.classList.remove("hidden");
}

function updateOrderType() {
  const isDel = $("input[name='otype']:checked").value === 'delivery';
  $("#addressBlock").style.display = isDel ? "block" : "none";
  
  const sub = state.cart.reduce((a,i)=>a+i.unit*i.qty,0);
  const del = isDel ? CONFIG.deliveryFee : 0;
  
  let summaryHtml = `
    <div class="totals" style="margin-top:12px">
      <div class="trow"><span>Subtotal</span><div class="text-right">${money(sub)}</div></div>`;
      
  if (isDel) {
    summaryHtml += `<div class="trow"><span>Delivery</span><div class="text-right">${money(del)}</div></div>`;
  }
  
  summaryHtml += `<div class="trow total"><span>Total</span><div class="text-right">${money(sub+del)}</div></div>
    </div>`;
    
  $("#checkoutSummary").innerHTML = summaryHtml;
    
  updatePayDetails();
}

function handleProofUpload(e) {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    state.proofImage = ev.target.result;
    $("#proofImg").src = state.proofImage;
    $("#proofPickerWrap").classList.add("hidden");
    $("#proofPreviewWrap").classList.remove("hidden");
  }; reader.readAsDataURL(file);
}
function clearProof() {
  state.proofImage = null;
  $("#proofFile").value = "";
  $("#proofPickerWrap").classList.remove("hidden");
  $("#proofPreviewWrap").classList.add("hidden");
}

// 👇 AQUÍ ESTÁ EL CAMBIO A OPENSTREETMAP PARA EVITAR EL BLOQUEO
function getLocation() {
  const btn = $("#btnLocation");
  const mapContainer = $("#mapPreviewContainer");
  const mapIframe = $("#mapPreviewIframe");
  const mapLink = $("#mapExternalLink");
  
  btn.textContent = "⏳ Obteniendo...";
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      const lat = pos.coords.latitude;
      const lng = pos.coords.longitude;
      
      state.userLocationUrl = `https://www.google.com/maps?q=${lat},${lng}`;
      btn.textContent = "✅ Ubicación capturada";
      btn.style.color = "var(--ok)";
      btn.style.borderColor = "var(--ok)";
      
      if (mapContainer && mapIframe && mapLink) {
        // Usamos OpenStreetMap para el iframe (no bloquea)
        // Calculamos un pequeño cuadro delimitador (bbox) alrededor del punto
        const offset = 0.003; 
        const bbox = `${lng - offset},${lat - offset},${lng + offset},${lat + offset}`;
        
        mapIframe.src = `https://www.openstreetmap.org/export/embed.html?bbox=${bbox}&layer=mapnik&marker=${lat},${lng}`;
        mapLink.href = state.userLocationUrl;
        
        mapContainer.classList.remove("hidden");
      }
    }, 
    () => { toast("Error al obtener ubicación"); btn.textContent = "📍 Reintentar"; }
  );
}

async function submitOrder() {
  const name = $("#f-name").value.trim();
  const phone = $("#f-phone").value.trim();
  const isDel = $("input[name='otype']:checked").value === 'delivery';
  const addr = $("#f-addr").value.trim();
  const notes = $("#f-notes").value.trim();
  const payMethod = $("#paySelect").options[$("#paySelect").selectedIndex].text;

  if (!name || !phone || (isDel && !addr)) { toast("Completa los campos obligatorios"); return; }

  const btn = $("#btnConfirm"); btn.disabled = true; btn.textContent = "Enviando...";

  let proofUrl = null;
  if (state.proofImage) {
    try {
      const res = await fetch(state.proofImage);
      const blob = await res.blob();
      const fileName = `proof-${Date.now()}.jpg`;
      const { error } = await supabaseClient.storage.from('productos').upload(fileName, blob);
      if (!error) {
        const { data } = supabaseClient.storage.from('productos').getPublicUrl(fileName);
        proofUrl = data.publicUrl;
      }
    } catch(e) {}
  }

  const sub = state.cart.reduce((a,i)=>a+i.unit*i.qty,0);
  const del = isDel ? CONFIG.deliveryFee : 0;
  const total = sub + del;
  const code = 'A-' + Math.floor(1000 + Math.random() * 9000);

  let msg = `*NUEVO PEDIDO ${code}*\n\n*Cliente:* ${name}\n*Tel:* ${phone}\n*Tipo:* ${isDel?'Delivery':'Retiro'}\n*Pago:* ${payMethod}\n\n`;
  state.cart.forEach(i => { msg += `- ${i.qty}x ${i.name} ($${i.unit*i.qty.toFixed(2)})\n`; });
  msg += `\n*Total:* $${total.toFixed(2)} (Bs. ${(total * EXCHANGE_RATE).toFixed(2)})`;

  const orderData = {
    code, status: 'recibido',
    customer: { name, phone, address: addr, locationUrl: state.userLocationUrl },
    items: state.cart, total, type: isDel ? 'delivery' : 'pickup',
    payment_method: payMethod, notes, proof_url: proofUrl
  };

  const { error } = await supabaseClient.from('orders').insert([orderData]);
  if (error) alert("Error al guardar pedido: " + error.message);

  window.open(`https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(msg)}`, '_blank');
  
  state.cart = []; state.proofImage = null; updateBadge();
  $("#viewCheckout").classList.add("hidden");
  $("#chatContainer").innerHTML = "";
  addBotMsg(`¡Gracias <b>${esc(name)}</b>! Tu pedido <b>${code}</b> ha sido enviado. Pronto te contactaremos por WhatsApp. 🍔✨`);
}

document.addEventListener("DOMContentLoaded", async () => {
  await loadData();
  setupWelcome();
});
</script>
